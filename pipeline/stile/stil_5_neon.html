<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stil 5 · Neon-Daten-Dashboard</title>
<link rel="stylesheet" href="gemeinsam.css">
<style>
  :root { --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; --cyan: #4da3ff; --org: #ff8a2a; --neon-gelb: #ffe14d; }
  body { background: #060912; }
  #bild { position: absolute; inset: 0; }
  .marke { position: absolute; top: 150px; left: 54px; display: flex; gap: 14px; }
  .marke > div { height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-radius: 12px; font-family: var(--display); font-weight: 800; font-size: 27px; letter-spacing: 0.1em; }
  .logo { color: #fff; padding-left: 9px !important; background: rgba(77, 163, 255, 0.08); box-shadow: inset 0 0 0 2px rgba(77, 163, 255, 0.55), 0 0 24px rgba(77, 163, 255, 0.35); }
  .rubrik { color: var(--neon-gelb); background: rgba(255, 225, 77, 0.08); box-shadow: inset 0 0 0 2px rgba(255, 225, 77, 0.7), 0 0 24px rgba(255, 225, 77, 0.35); text-shadow: 0 0 12px rgba(255, 225, 77, 0.7); }
  .titel { position: absolute; left: 54px; top: 256px; width: 876px; }
  .titel .klein { font-family: var(--mono); font-weight: 700; font-size: 25px; letter-spacing: 0.04em; color: var(--cyan); text-shadow: 0 0 14px rgba(77, 163, 255, 0.6); }
  .titel .klein::before { content: "> "; color: rgba(255, 255, 255, 0.45); }
  .titel .gross { font-family: var(--display); font-weight: 900; font-size: 78px; line-height: 1; letter-spacing: -0.025em; color: #fff; margin-top: 12px; text-shadow: 0 0 30px rgba(120, 170, 255, 0.25); }
  .kpi { position: absolute; top: 500px; width: 429px; height: 196px; border-radius: 22px; padding: 22px 28px; background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); box-shadow: inset 0 0 0 2px var(--rand), 0 0 34px -6px var(--glut); }
  .kpi.a { left: 54px; --f: var(--cyan); --rand: rgba(77, 163, 255, 0.6); --glut: rgba(77, 163, 255, 0.55); }
  .kpi.b { left: 501px; --f: var(--org); --rand: rgba(255, 138, 42, 0.65); --glut: rgba(255, 138, 42, 0.55); }
  .kpi .kopf { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-weight: 700; font-size: 23px; letter-spacing: 0.06em; color: var(--f); }
  .kpi .kopf span { font-weight: 500; color: rgba(255, 255, 255, 0.5); font-size: 20px; }
  .kpi .betrag { font-family: var(--mono); font-weight: 800; font-size: 76px; line-height: 1.1; letter-spacing: -0.04em; color: #fff; margin-top: 10px; text-shadow: 0 0 22px var(--glut); white-space: nowrap; }
  .kpi .einheit { font-family: var(--mono); font-weight: 500; font-size: 21px; color: rgba(255, 255, 255, 0.55); }
  .hinweis { position: absolute; right: 150px; top: 718px; font-family: var(--mono); font-weight: 500; font-size: 20px; color: rgba(255, 255, 255, 0.45); }
  .achse { position: absolute; font-family: var(--mono); font-weight: 500; font-size: 20px; color: rgba(255, 255, 255, 0.45); }
  .marker { position: absolute; transform: translate(-50%, -100%); padding: 10px 16px; border-radius: 10px; background: rgba(255, 225, 77, 0.12); box-shadow: inset 0 0 0 2px rgba(255, 225, 77, 0.8), 0 0 26px rgba(255, 225, 77, 0.45); font-family: var(--mono); font-weight: 700; font-size: 23px; color: var(--neon-gelb); white-space: nowrap; text-shadow: 0 0 10px rgba(255, 225, 77, 0.6); }
</style>
</head>
<body>
<div id="bild"></div>
<div id="hud"></div>
<script type="module" src="./stil_5_neon.js"></script>
</body>
</html>
