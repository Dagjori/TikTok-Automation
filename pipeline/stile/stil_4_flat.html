<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stil 4 · 2D-Flat-Infografik</title>
<link rel="stylesheet" href="gemeinsam.css">
<style>
  body { background: #fff3dc; }
  #bild { position: absolute; inset: 0; }
  .marke { position: absolute; top: 150px; left: 54px; display: flex; gap: 12px; }
  .marke > div { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-radius: 16px; font-family: var(--display); font-weight: 900; font-size: 28px; letter-spacing: 0.07em; }
  .logo { background: #1d2b53; color: #fff; padding-left: 9px !important; }
  .rubrik { background: var(--gelb); color: #1d2b53; }
  .titel { position: absolute; left: 54px; top: 254px; width: 876px; color: #1d2b53; }
  .titel .klein { display: inline-block; font-family: var(--display); font-weight: 900; font-size: 28px; letter-spacing: 0.06em; text-transform: uppercase; color: #e85d2a; }
  .titel .gross { font-family: var(--display); font-weight: 900; font-size: 82px; line-height: 0.98; letter-spacing: -0.03em; margin-top: 10px; }
  .badge { position: absolute; top: 1098px; width: 360px; height: 164px; border-radius: 26px; background: #fff; color: #1d2b53; padding: 20px 24px 0 128px; box-shadow: 0 10px 0 rgba(29, 43, 83, 0.12); }
  .badge.a { left: 54px; }
  .badge.b { left: 570px; }
  .badge .icon { position: absolute; left: 22px; top: 32px; width: 88px; height: 88px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .badge.a .icon { background: var(--blau); }
  .badge.b .icon { background: var(--orange); }
  .badge .wer { font-family: var(--display); font-weight: 900; font-size: 24px; letter-spacing: 0.07em; }
  .badge.a .wer { color: var(--blau); }
  .badge.b .wer { color: #e05f12; }
  .badge .betrag { font-family: var(--display); font-weight: 900; font-size: 58px; line-height: 1.05; letter-spacing: -0.03em; white-space: nowrap; }
  .badge .einheit { font-family: var(--text); font-weight: 700; font-size: 21px; color: #6a7392; }
  .vs { position: absolute; left: 492px; top: 1180px; width: 92px; height: 92px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--gelb); color: #1d2b53; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 900; font-size: 32px; box-shadow: 0 0 0 10px #fff3dc; }
  .hinweis { position: absolute; left: 54px; top: 486px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8fa8; }
</style>
</head>
<body>
<div id="bild"></div>
<div id="hud"></div>
<script type="module" src="./stil_4_flat.js"></script>
</body>
</html>
