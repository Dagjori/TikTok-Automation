<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stil 12 · Comic-Toon 3D</title>
<link rel="stylesheet" href="gemeinsam.css">
<link rel="stylesheet" href="massstab.css">
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
<style>
  @font-face { font-family: "SB Kursiv"; font-weight: 900; font-style: italic; src: url("../node_modules/@fontsource/inter/files/inter-latin-900-italic.woff2") format("woff2"); }
  body { background: #ffe14d; }
  :root {
    --a: #1f7bff; --a-hell: #6fb4ff; --b: #ff4d2e; --b-hell: #ff9a80;
    --tafel-bg: #ffffff; --tafel-text: #111; --tafel-grau: #333; --tafel-radius: 10px; --tafel-rand: 7px solid #111; --tafel-schatten: 12px 12px 0 #111;
    --mitte-bg: #ffe14d; --mitte-text: #111; --mitte-rand: 7px solid #111;
    --chip-bg: #ffe14d; --chip-text: #111; --chip-radius: 8px; --chip-rand: 5px solid #111; --chip-schatten: 7px 7px 0 #111;
    --zahl-schrift: "SB Kursiv", var(--display);
  }
  /* Comic-Panels: leicht schräg, harte Versatz-Schatten, kursive Zahlen */
  .tafel9 .karte.a { transform: rotate(-1.6deg); }
  .tafel9 .karte.b { transform: rotate(1.6deg); }
  .tafel9 .wer { border: 4px solid #111; border-radius: 8px; height: 52px; }
  .tafel9 .wert { font-style: italic; }
  .tafel9 .mitte { transform: translate(-50%, -50%) rotate(-4deg); }
  .tafel9 .mitte b { font-style: italic; }
  /* Sticker mit Strahlenkranz */
  .knall { position: absolute; z-index: 16; width: 400px; height: 256px; transform: translate(-50%, -50%) rotate(-9deg); }
  .knall svg { position: absolute; inset: 0; overflow: visible; }
  .knall span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "SB Kursiv"; font-style: italic; font-weight: 900;
    font-size: 60px; letter-spacing: -0.02em; color: #fff; -webkit-text-stroke: 5px #111; paint-order: stroke fill; text-shadow: 6px 6px 0 #111; }
</style>
</head>
<body>
<canvas id="leinwand" width="1080" height="1920"></canvas>
<div id="hud"></div>
<script type="module" src="./stil_12_comic.js"></script>
</body>
</html>
