<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stil 14 · Glas-Labor</title>
<link rel="stylesheet" href="gemeinsam.css">
<link rel="stylesheet" href="massstab.css">
<style>
  body { background: #f3e3ee; }
  /* Tafel aus Milchglas über der Studio-Szene */
  :root {
    --a: #2f6fed; --a-hell: #86b6ff; --b: #ff7a1a; --b-hell: #ffb36b;
    --tafel-bg: rgba(255, 255, 255, 0.42); --tafel-text: #1b2140; --tafel-grau: #6b6f8a; --tafel-radius: 36px; --tafel-rand: 2px solid rgba(255, 255, 255, 0.85);
    --tafel-schatten: inset 0 2px 0 rgba(255, 255, 255, 0.8), 0 24px 44px -18px rgba(60, 40, 80, 0.45);
    --mitte-bg: rgba(27, 33, 64, 0.88); --mitte-text: #fff; --mitte-rand: 3px solid rgba(255, 255, 255, 0.9);
    --chip-bg: #ffd23f; --chip-text: #1b2140;
  }
  .tafel9 .karte, .tafel9 .mitte { backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); }
  .marke214 { position: absolute; z-index: 14; font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: 0.04em; color: #ff7a1a; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.7); border: 2px solid #ff7a1a; transform: translate(0, -50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="leinwand" width="1080" height="1920"></canvas>
<div id="hud"></div>
<script type="module">
  import { el, zonen, fertig } from "./gemeinsam.js";
  import { INHALT9, anzeigetafel, chip, phrase, hintergrund } from "./massstab.js";
  try {
    await hintergrund("../out/stile/blender/stil_14_glas.png");
    const hud = document.getElementById("hud");
    anzeigetafel(hud);
    chip(hud, `${INHALT9.chip} · Fahrt 13`, { x: 492, y: 1000 });
    phrase(hud);
    zonen(hud);
    fertig();
  } catch (e) { window.__fehler = String(e); }
</script>
</body>
</html>
