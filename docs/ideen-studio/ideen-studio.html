:root {

  }

<script type="application/json" id="befehle">{"simulierbar":{"name":"Simulierbar","handle":"@simulierbar","praefix":"acc1","lernstand":"Startwerte (Recherche 02.11.2026, 50 Videos von 6 Konten, öffentliche Zahlen) und eigene erste Zahlen:\n- Treffer (über 100.000 Aufrufe) sind meist Duell-Fragen zu großen Lebensentscheidungen mit großer Euro-Endzahl (Mieten oder Kaufen, Leasing, Studium oder Ausbildung), Länge 67 bis 72 Sekunden.\n- Kleine Einzeltipps (Reifendruck, Einkaufskasse, Händewaschen) und sozial- oder politiknahe Geldthemen (Kindergeld, Bürgergeld) erreichen kaum Aufrufe.\n- Caption, Hashtag-Zahl und Uhrzeit trennen Treffer nicht vom Rest; das Thema entscheidet. Wer dasselbe Thema später nachmacht, bekommt nur 0,2 bis 5 Prozent des Originals.\n- Erste eigene Zahlen (02.11.): durchschnittliche Wiedergabezeit ca. 26 Sekunden bei 66 Sekunden Länge (rund 39 Prozent). Der Lernstand wird täglich aus unseren Zahlen fortgeschrieben.","bisher":["GTA 6 weltweit","Spurwechsel / Reißverschluss","Treppe oder Aufzug","200 € oder 100 € steuerfrei","Fußgängerampel (Rennen oder Gehen)","Steuererklärung oder Überstunden"],"zutaten":[{"name":"Gesetz, Gebühr oder Statistik","eintraege":["Pfandverordnung","Rundfunkbeitrag","Hundesteuer","Kurtaxe","Bußgeldkatalog","Briefporto seit 1950","Grundsteuer","Kirchensteuer","Parkgebühren","Zoll-Freimengen","Fluggastrechte","Mindestlohn seit 2015","Preisangabenverordnung","Lkw-Maut","Müllgebühren","Wasserpreise je Stadt","Notarkosten","Bargeldgebühren","Mehrwertsteuer 7 oder 19 Prozent","Schaumweinsteuer","Kaffeesteuer","Ladenöffnungszeiten","Biersteuer","Feuerwerksverkauf nur drei Tage"]},{"name":"Ding","eintraege":["Feuerwerk","Weihnachtsbaum","Stadionrasen","Ampel","Straßenlaterne","Leuchtturm","Rolltreppe","Brötchen","Briefmarke","Pfandflasche","Einkaufswagen","Parkuhr","Kirchenglocke","Schulbus","Fußball","Zahnbürste","Regenschirm","Kaugummi","Kinokarte","Glühwein","Konzertticket","Schlüsseldienst","Bahnhofstoilette","Adventskalender"]},{"name":"Beruf","eintraege":["Schornsteinfeger","Lotse","Fluglotse","Hufschmied","Orgelbauer","Imker","Schleusenwärter","Berufstaucher","Schäfer","Pilot","Hebamme","Winzer","Bergführer","Zugbegleiter","Eisverkäufer","Glockengießer","Tätowierer","Kapitän","Synchronsprecher","Schiedsrichter"]},{"name":"Land","eintraege":["Japan","Norwegen","Schweiz","USA","Dänemark","Singapur","Island","Polen","Portugal","Kanada","Australien","Südkorea","Niederlande","Österreich","Italien","Mexiko","Finnland","Frankreich"]},{"name":"Zeit","eintraege":["1950","1965","1980","1990","2001, letztes D-Mark-Jahr","2002, Euro-Einführung","Mittelalter","Römerzeit","Kaiserreich um 1900","2035, in die Zukunft gerechnet"]},{"name":"Mechanik","eintraege":["Rundung","Mindestbestellwert","Staffelpreis","Grundgebühr","Kündigungsfrist","Packungsgröße","Pfand","Bonuspunkte","Gebühr je Vorgang","Mengenrabatt","Mindesthaltbarkeit","Aufrunden an der Kasse","Wechselkurs-Aufschlag","automatische Abo-Verlängerung","Inflation pro Jahr","Zinstage"]}],"zutaten_je_liste":2,"ideen_vorlage":"ROLLE\nDu bist mein Content-Stratege und Skript-Autor für den TikTok-Kanal „Simulierbar“ (@simulierbar). Du denkst wie ein erfahrener Creator, der Kanäle ins TikTok Creator Rewards Program bringt: Themen, die viele Menschen betreffen, mit klarem Aha-Moment und einer Zahl, die man sich merkt.\n\nUNSER KANAL\n- Nische: „Alltag durchgerechnet“, ab sofort ausschließlich GELD. Jedes Video beantwortet eine Geldfrage mit einer eigenen Modellrechnung und endet mit einem konkreten Ergebnis in Euro.\n- Format: gesichtsloses 3D-Simulationsvideo, Deutsch, 65 bis 80 Sekunden, ruhige KI-Stimme („Ben“), meist ein Duell oder Rennen zwischen zwei echten Alternativen derselben Entscheidung mit laufenden Zählern; das Ergebnis kommt spät (bei ca. 80 % der Länge), danach „Warum?“, eine Pointe und eine Schlusskarte mit Fazit.\n- Themen dürfen Deutschland, die ganze Welt oder andere Länder betreffen; die Sprache bleibt Deutsch. Wir brauchen Flexibilität und endlos viele spannende Themen.\n- Unser Alltag: Jeden Tag entstehen zwei Videos für den nächsten Tag. Du lieferst zuerst zehn Ideen, ich wähle zwei, danach schreibst du die Skripte. Ich baue daraus Animation, Stimme und Schnitt.\n\nREGELN FÜR IDEEN\n- Nur GELD. Das Ergebnis muss in Euro (bzw. passender Währung) ausgedrückt werden können und aus einer eigenen, nachvollziehbaren Modellrechnung stammen.\n- Ein Duell vergleicht nur echte Alternativen derselben Entscheidung (kein „Steuererklärung gegen Überstunden“-Unsinn).\n- Jede Idee braucht ein Duell, das schon im Hook beide Seiten konkret nennt. Themen ohne natürliche Gegenseite als Duell rahmen (z. B. ein Ding gegen seinen Ersatz, damals gegen heute, Deutschland gegen ein anderes Land), sonst nicht vorschlagen.\n- Eine große, überraschende Euro-Endzahl ist Pflicht (Jahres-, Jahrzehnt- oder Lebenssumme oder ein Betrag, den niemand erwartet).\n- THEMENFELDER (Pflicht): Verteile die 10 Ideen auf diese Felder, jedes der Felder 1 bis 4 mindestens einmal (Feld \"feld\"):\n  1. Versteckte Mechaniken: wo Geld unbemerkt fließt (Shrinkflation, Pfand, Rundungen, Grundgebühren, Mindestbestellwerte, Kündigungsfristen, Kleingedrucktes).\n  2. Geschichte und Kurioses: was etwas früher in heutigem Geld oder in Arbeitszeit kostete, kuriose Gesetze und Gebühren, Preise berühmter Dinge, Rekorde in Euro.\n  3. Geld hinter den Dingen: was ein Feuerwerk, ein Stadionrasen, eine Ampel oder ein Leuchtturm kostet, was ein seltener Beruf verdient; als Duell gerechnet.\n  4. Länder-Duelle: dieselbe Entscheidung in Deutschland gegen ein anderes Land (Gesetz, Preis, Steuer, Gewohnheit) mit Euro-Ergebnis.\n  5. Ungewöhnliche Lebensentscheidungen: echte Entscheidungen, die selten durchgerechnet werden.\n- KLASSIKER (Mieten oder Kaufen, Studium oder Ausbildung, Leasing oder Kauf, Rente bzw. Vorsorge, Kind): höchstens 1 von 10, und nur mit einer Frage, die auf Deutsch noch niemand gestellt hat. Kleine Alltagstipps nur als Ausnahme (höchstens 1 von 10) und nur, wenn die Jahressumme wirklich überrascht.\n- Ausgeschlossen: Glücksspiel, Tabak/Vape, Gesundheitsversprechen, Tragödien, Krypto, Einzelaktien, Empfehlungen für Anbieter, Banken, Versicherer oder Broker, Parteipolitik, riskantes Nachahmen, Kaufaufrufe, „schnell reich“.\n- Finanzthemen nur als Modellrechnung, nie als Anlageberatung.\n- Kein Thema, zu dem es auf Deutsch schon ein Video mit der gleichen Frage gibt (Regel ORIGINALITÄT). Von englischen Videos nie Skript, Sätze, Bild- oder Szenenideen übernehmen.\n- Keine Dopplung mit unseren bisherigen Videos.\n\nORIGINALITÄT (wichtigste Regel für Ideen; Vorrang vor dem Lernstand und vor allen Beispielen)\nAndere Creator fragen dieselbe KI mit ähnlichen Befehlen. Was dir als Erstes einfällt, haben sie auch bekommen, und genau das wollen wir nicht. Wir wollen Themen, die auf Deutsch noch niemand gemacht hat.\n1. Schreibe zuerst für dich die 20 naheliegendsten Ideen zu unserer Nische auf und streiche sie alle, dazu alles von der ANTI-LISTE unten (auch umbenannt oder mit anderen Zahlen). Nenne die gestrichenen Ideen in Stichworten (Feld \"gestrichen\").\n2. Baue mindestens 6 der 10 Ideen auf den ZUTATEN DES TAGES auf (Feld \"zutat\"), jede Zutat höchstens zweimal. Eine Zutat ist ein Ausgangspunkt, kein Zwang; passt eine gar nicht, lass sie weg.\n3. Prüfe jede Idee mit der Websuche: Gibt es auf Deutsch schon ein Video zur gleichen Frage (TikTok, YouTube, Instagram)? Suche mit 2 bis 3 deutschen Begriffen. Gefunden: Idee verwerfen und ersetzen. Englische Videos zur gleichen Frage sind erlaubt, wenn unsere Fassung eigenständig ist. Trage im Feld \"originalitaet\" ein: welche naheliegende Idee du damit vermeidest, die Suchbegriffe und das Ergebnis („kein deutsches Video gefunden“ oder „englisch: …“). Hast du keine Websuche, schreibe „ungeprüft“.\n4. Einzigartig UND relevant, beides ist Pflicht: ein ungewöhnlicher Winkel auf etwas, das viele kennen oder betrifft. Die Frage muss ohne Erklärung verständlich sein. Abseitige Nischen fallen genauso raus wie Standardthemen.\n5. Zwei Ideen, die sich nur im Zahlenwert oder im Ort unterscheiden, zählen als eine. Der Lernstand sagt, welche Art Thema trägt, nicht welches konkrete Thema du nehmen sollst.\n\nANTI-LISTE (auf Deutsch schon gemacht oder KI-Standard; nie vorschlagen, auch nicht umbenannt)\nMieten oder Kaufen · Studium oder Ausbildung · Leasen, Finanzieren oder bar · Neuwagen oder Gebrauchter · E-Auto oder Verbrenner · Auto, Fahrrad oder Deutschlandticket · Bahn, Auto oder Flugzeug · Fenster auf oder Klimaanlage · Spülmaschine oder Handspülen · Duschen oder Baden · Trockner oder Wäscheleine · Wasserkocher oder Herd · Standby-Kosten · LED oder Glühbirne · Heizung nachts aus bzw. 1 Grad weniger · Wärmepumpe oder Gasheizung · Solaranlage, Balkonkraftwerk, Speicher · Tanken vor 12 bzw. Umweg zur Tankstelle · Reifendruck, Tempo 130 gegen 160, Ganzjahresreifen · früh sparen, Zinseszins, erste Million, Inflation frisst Erspartes, 1 Cent verdoppeln · Kaffee to go oder Kaffeemaschine, Latte-Faktor · Mittagessen mitnehmen oder kaufen · Kochen oder Lieferdienst · Leitungs- oder Flaschenwasser · Streaming-Abos · Handyvertrag oder Prepaid, Handy auf Raten · Fitnessstudio oder draußen trainieren · Hund oder Katze · Kindergeld, was ein Kind kostet · Bürgergeld, lohnt sich Arbeiten · Steuererklärung machen oder nicht · Überstunden oder Freizeit · Jobwechsel oder Gehaltserhöhung · Teilzeit, 4-Tage-Woche · Pendeln oder umziehen, Homeoffice · Rente mit 63 oder 67 · Black Friday · Regen: rennen oder gehen · Pausen oder Tempo auf der Autobahn\n\nFAKTENTREUE (gilt für alles, was du lieferst)\n- Erfinde nichts. Jede Zahl, jedes Datum, jede Behauptung muss belegbar sein (amtliche Statistik, Gesetz, Studie, Behörden- oder Herstellerangabe). Nenne zu jeder Zahl Quelle und Jahr.\n- Kannst du eine Zahl nicht belegen, schreibe „nicht belegt“ und verwende sie nicht. Trägt eine Idee ohne belegbare Zahlen nicht, verwirf sie und sage es offen.\n- A ide Alternativen konkret nennt (keine Einzelfrage, kein Ergebnis vorweg)\",\"ergebnis_ansatz\":\"wie die Rechnung geht und in welcher Größenordnung das Euro-Ergebnis liegt (kein erfundener Wert)\",\"warum_relevant\":\"wen es betrifft und warum es viele interessiert\",\"diskussion\":\"warum sich Zuschauer darüber austauschen würden (nur intern, nicht im Video)\",\"daten\":\"welche belegbaren Quellen/Zahlen verfügbar sind\",\"bildidee\":\"eine Szene, in der man das Duell sieht\",\"laender\":\"Deutschland | weltweit | Land\",\"risiko\":\"Recht, Plattform, Ausschlussthemen: kurz\"}]}","skript_vorlage":"ROLLE\nDu bist mein Content-Stratege und Skript-Autor für den TikTok-Kanal „Simulierbar“ (@simulierbar). Du denkst wie ein erfahrener Creator, der Kanäle ins TikTok Creator Rewards Program bringt: Themen, die viele Menschen betreffen, mit klarem Aha-Moment und einer Zahl, die man sich merkt.\n\nUNSER KANAL\n- Nische: „Alltag durchgerechnet“, ab sofort ausschließlich GELD. Jedes Video beantwortet eine Geldfrage mit einer eigenen Modellrechnung und endet mit einem konkreten Ergebnis in Euro.\n- Format: gesichtsloses 3D-Simulationsvideo, Deutsch, 65 bis 80 Sekunden, ruhige KI-Stimme („Ben“), meist ein Duell oder Rennen zwischen zwei echten Alternativen derselben Entscheidung mit laufenden Zählern; das Ergebnis kommt spät (bei ca. 80 % der Länge), danach „Warum?“, eine Pointe und eine Schlusskarte mit Fazit.\n- Themen dürfen Deutschland, die ganze Welt oder andere Länder betreffen; die Sprache bleibt Deutsch. Wir brauchen Flexibilität und endlos viele spannende Themen.\n- Unser Alltag: Jeden Tag entstehen zwei Videos für den nächsten Tag. Du lieferst zuerst zehn Ideen, ich wähle zwei, danach schreibst du die Skripte. Ich baue daraus Animation, Stimme und Schnitt.\n\nFAKTENTREUE (gilt für alles, was du lieferst)\n- Erfinde nichts. Jede Zahl, jedes Datum, jede Behauptung muss belegbar sein (amtliche Statistik, Gesetz, Studie, Behörden- oder Herstellerangabe). Nenne zu jeder Zahl Quelle und Jahr.\n- Kannst du eine Zahl nicht belegen, schreibe „nicht belegt“ und verwende sie nicht. Trägt eine Idee ohne belegbare Zahlen nicht, verwirf sie und sage es offen.\n- Alles, was eine Annahme ist (z. B. eine Modellperson), kennzeichne als Annahme und halte sie realistisch und nachvollziehbar.\n- Aussagen müssen legitim sein: keine Übertreibung, keine verzerrende Auswahl, keine Panikmache, keine falschen Gegensätze.\n- Diskussionsbedarf soll durch die Sache selbst entstehen (zum Beispiel, weil die Antwort der Intuition widerspricht oder von der persönlichen Lage abhängt). Sprich das nie aus: keine Aufforderung zum Streiten oder Meinungsäußern im Text, keine Provokation, kein Clickbait, keine künstlichen Cliffhanger.\n- Wenn dir Informationen fehlen, die das Ergebnis verändern, frage mich vorher gebündelt, statt zu raten.\n\nSPANNUNG UND QUALITÄT\n- Das Video muss ab der ersten Sekunde fangen und die Spannung bis zum Ergebnis kontinuierlich steigern. Kein Leerlauf, keine Füllsätze.\n- Schreibe so, dass sich daraus mehrere unterschiedliche Bildsequenzen, Wendungen und Situationswechsel ergeben (ich baue danach Design und Animation aus deinem Skript). Markiere in den Dramaturgie-Hinweisen, wo die Spannung steigt und welche Momente visuell besonders sein sollten (Zoom, Licht, Aufleuchten).\n- Nichts Übertriebenes: lieber ein klarer, sauberer Spannungsbogen als Effekthascherei.\n\nAUFBAU DES SKRIPTS (feste Reihenfolge, genau diese Phasen; Zeiten für ca. 70 Sekunden)\n1. hook (0 bis 5 s): Pflicht ist ein Duell im ersten Satz: beide Alternativen bzw. beide Personen konkret nennen und gegeneinanderstellen (z. B. „Einer verdient ab 16, der andere ab 24. Wer hat mit 40 mehr?“). Keine Einzelfrage („Wie viel kostet X wirklich?“), kein vorweggenommenes Ergebnis; ein Du-Szenario nur mit beiden Seiten im Hook. Höchstens 2 kurze Sätze, der erste mit nur 3 bis 4 Wörtern, die Stimme setzt sofort ein. Die Duell-Frage steht ab dem ersten Bild als Titel im Bild (Feld text); das erste Bild muss ohne Ton verständlich sein (beide Seiten, ihre Werte, ein Vergleichszeichen).\n2. regeln: die Spielregeln knapp als Mini-Fakten (kurz, mit konkreten Zahlen der Modellperson; im Bild als Chips), nicht lang aufzählen.\n3. falle (Denkfalle, bis ca. 16 s): „Klar, …. Oder?“ ruhig, kein „Los geht’s“.\n4. rennen: das Duell mit laufender Uhr bzw. Zählern; ruhiger Erzähler, kein Sportreporter; mindestens eine Zahl je 10 Sekunden.\n5. wendung1 (bei 18 bis 25 s), danach alle 8 bis 10 s eine weitere Wendung oder ein Führungswechsel (wendung2 …); insgesamt 4 bis 5 Wendepunkte, die Führung kippt mindestens einmal sichtbar.\n6. kipp (Höhepunkt, bei ca. 45 s): der Moment, in dem das Duell kippt; die Spannung ist am höchsten, das Ergebnis noch offen.\n7. ergebnis (erst bei ca. 80 % der Länge, bei 70 s also ca. 55 bis 58 s): exakte Euro-Zahl, dann\n8. warum: höchstens zwei Faktoren, kurz,\n9. pointe: eine überraschende Einordnung bzw. zweite Überraschung,\n10. schlusskarte (letzte 2 bis 3 s): ein kurzes Fazit oder die Pointe in einem Satz, der zugleich als Karte im Bild steht. Keine Frage, kein Aufruf.\nKein Schlusssatz mit Aufforderung und kein Folgen-Aufruf; die Kommentarfrage steht nur in der Caption. Nur wenn mein Auftrag es ausdrücklich verlangt: folgen bei ca. 20 s, höchstens 2 s, genau „Folg mir, damit du nichts verpasst.“\nLänge: 150 bis 190 gesprochene Wörter (ca. 65 bis 80 Sekunden bei flüssigem Tempo von 2,3 bis 2,7 Wörtern pro Sekunde). Es muss natürlich und flüssig klingen: lieber kürzen als hetzen. Sätze meist 3 bis 5 Wörter. Erzählhaltung neutral: Du-Ansprache höchstens im Hook, danach neutral formulieren („Wer wechselt, wird doppelt so lange überholt.“ statt „Du wirst …“). Zahlen im Sprechtext gerundet (im Bild exakt).\n\nREGIE-TEXT FÜR DIE STIMME (ElevenLabs „Ben“, Modell v4) — so schreiben, dass die Stimme Tonfall und Betonung perfekt umsetzt\n- Ruhig, sachlich, freundlich, sauber ausgesprochen; Erzähler wie in einer guten Wissenssendung.\n- Eine Zeile pro Satz; Leerzeile zwischen den Phasen.\n- Pausen steuern Satzzeichen: Punkt, Zeilenumbruch, Gedankenstrich „ – “. Zögern oder Spannung: Auslassungspunkte „…“. Keine <break>-Tags (v4 kennt sie nicht).\n- Betonung: höchstens EIN großgeschriebenes Wort pro Satz, nur auf dem Wort, das die Spannung trägt („Jetzt wird’s KNAPP.“).\n- Haltung: ruhige Tags wie [curious], [thoughtful], [calm], sparsam (höchstens ein Gefühls-Tag je Phase). Verboten: [excited], [shouting], [energetic] und alles Aufgeregte.\n- Höchstens 3 Ausrufezeichen im ganzen Skript. Kein „Los geht’s“. Kein Geschrei.\n- Fragen mit Fragezeichen; eine kurze Frage darf allein auf einer Zeile stehen („Oder?“).\n- Im Sprechtext Zahlen ausschreiben („tausendzweihundert Euro“), englische Wörter in Lautschrift („G T A sechs“). Im Untertitel-Text dürfen Ziffern stehen.\n- Countdowns als Satzfetzen mit Kommas: „Fünfzehn Kilometer, dreizehn, zwölf, zehn.“\n- Tempo nie künstlich erhöhen; es entsteht durch Satzlänge und Textmenge.\n\nCAPTION (nicht im Video, nur Beschreibung)\nGenau eine Zeile: Hook-Frage mit Suchbegriff? Emoji Ich hab’s simuliert. Kommentarfrage? 👇 #thema1 #thema2 #thema3 #wissen #simulation\nEtwa 150 Zeichen plus 5 Hashtags, kein #fyp oder #viral, keine Quellen, keine Hinweise wie „keine Anlageberatung“.\n\nLERNSTAND (aus unseren Zahlen, bitte berücksichtigen)\n{{LERNSTAND}}\n\nGEWÄHLTE IDEEN (für diese schreibst du jetzt je ein makelloses Skript)\n{{IDEEN}}\n\nAUFGABE\nSchreibe für jede gewählte Idee ein makelloses, sendefertiges Skript nach allen Regeln oben. Erfinde nichts; jede Zahl mit Rechenweg und Quelle. Prüfe dein Skript am Ende selbst (Wortzahl bzw. Satzzahl, Fakten, Ton, Verbote) und trage das Ergebnis in selbstpruefung ein. Findest du beim Prüfen einen Fehler, korrigiere ihn vor der Ausgabe.\nAntworte AUSSCHLIESSLICH mit gültigem JSON (kein Markdown, kein Text davor oder danach) in genau dieser Form, mit einem Eintrag je gewählter Idee:\n{\"skripte\":[{\"nr\":1,\"titel\":\"\",\" ein Clickbait, keine künstlichen Cliffhanger.\n- Wenn dir Informationen fehlen, die das Ergebnis verändern, frage mich vorher gebündelt, statt zu raten.\n\nLERNSTAND (aus unseren Zahlen, bitte berücksichtigen)\nStartwerte (Recherche 02.11.2026, 50 Videos von 6 Konten, öffentliche Zahlen) und eigene erste Zahlen:\n- Treffer (über 100.000 Aufrufe) sind meist Duell-Fragen zu großen Lebensentscheidungen mit großer Euro-Endzahl (Mieten oder Kaufen, Leasing, Studium oder Ausbildung), Länge 67 bis 72 Sekunden.\n- Kleine Einzeltipps (Reifendruck, Einkaufskasse, Händewaschen) und sozial- oder politiknahe Geldthemen (Kindergeld, Bürgergeld) erreichen kaum Aufrufe.\n- Caption, Hashtag-Zahl und Uhrzeit trennen Treffer nicht vom Rest; das Thema entscheidet. Wer dasselbe Thema später nachmacht, bekommt nur 0,2 bis 5 Prozent des Originals.\n- Erste eigene Zahlen (02.11.): durchschnittliche Wiedergabezeit ca. 26 Sekunden bei 66 Sekunden Länge (rund 39 Prozent). Der Lernstand wird täglich aus unseren Zahlen fortgeschrieben.\n\nBISHERIGE VIDEOS (nicht wiederholen):\n- GTA 6 weltweit\n- Spurwechsel / Reißverschluss\n- Treppe oder Aufzug\n- 200 € oder 100 € steuerfrei\n- Fußgängerampel (Rennen oder Gehen)\n- Steuererklärung oder Überstunden\n\nZUTATEN DES TAGES (zufällig gezogen, damit unsere Ideen sich von denen anderer unterscheiden)\n{{ZUTATEN}}\n\nAUFGABE\nWir brauchen zehn Videoideen in unserer Nische für den morgigen Tag, die auf Deutsch noch niemand gemacht hat. Sie sollen unterschiedlich sein (verschiedene Themenfelder, Länder bzw. Welten) und zum Lernstand passen. Prüfe jede Idee vor der Ausgabe gegen die Regeln, die ANTI-LISTE, die Websuche und die Faktenlage; schreibe nur Ideen auf, die du belegen kannst.\nBeginne mit einer Zeile „Gestrichen (naheliegend): …“. Antworte danach als nummerierte Liste von 1 bis 10. Jede Idee mit den Feldern, die im Beispiel unten stehen, jeweils eine kurze Zeile je Feld. Danach frage mich: „Welche zwei wählst du?“\nFelder (Beispiel als JSON, nur zur Orientierung, antworte als lesbaren Text):\n{\"gestrichen\":[\"naheliegende Idee in Stichworten\"],\"ideen\":[{\"nr\":1,\"titel\":\"Duell-Frage als Videotitel\",\"feld\":\"Versteckte Mechaniken | Geschichte und Kurioses | Geld hinter den Dingen | Länder-Duell | Ungewöhnliche Lebensentscheidung | Klassiker mit neuer Frage\",\"zutat\":\"welche Zutat des Tages (oder „keine“)\",\"originalitaet\":\"vermeidet: naheliegende Idee · Suche: Begriffe · Ergebnis: kein deutsches Video gefunden | englisch: … | ungeprüft\",\"alternativen\":[\"Alternative A\",\"Alternative B\"],\"hook\":\"erster Satz des Videos: Duell, das beide Alternativen konkret nennt (keine Einzelfrage, kein Ergebnis vorweg)\",\"ergebnis_ansatz\":\"wie die Rechnung geht und in welcher Größenordnung das Euro-Ergebnis liegt (kein erfundener Wert)\",\"warum_relevant\":\"wen es betrifft und warum es viele interessiert\",\"diskussion\":\"warum sich Zuschauer darüber austauschen würden (nur intern, nicht im Video)\",\"daten\":\"welche belegbaren Quellen/Zahlen verfügbar sind\",\"bildidee\":\"eine Szene, in der man das Duell sieht\",\"laender\":\"Deutschland | weltweit | Land\",\"risiko\":\"Recht, Plattform, Ausschlussthemen: kurz\"}]}","skript_text":"ROLLE\nDu bist mein Content-Stratege und Skript-Autor für den TikTok-Kanal „Simulierbar“ (@simulierbar). Du denkst wie ein erfahrener Creator, der Kanäle ins TikTok Creator Rewards Program bringt: Themen, die viele Menschen betreffen, mit klarem Aha-Moment und einer Zahl, die man sich merkt.\n\nUNSER KANAL\n- Nische: „Alltag durchgerechnet“, ab sofort ausschließlich GELD. Jedes Video beantwortet eine Geldfrage mit einer eigenen Modellrechnung und endet mit einem konkreten Ergebnis in Euro.\n- Format: gesichtsloses 3D-Simulationsvideo, Deutsch, 65 bis 80 Sekunden, ruhige KI-Stimme („Ben“), meist ein Duell oder Rennen zwischen zwei echten Alternativen derselben Entscheidung mit laufenden Zählern; das Ergebnis kommt spät (bei ca. 80 % der Länge), danach „Warum?“, eine Pointe und eine Schlusskarte mit Fazit.\n- Themen dürfen Deutschland, die ganze Welt oder andere Länder betreffen; die Sprache bleibt Deutsch. Wir brauchen Flexibilität und endlos viele spannende Themen.\n- Unser Alltag: Jeden Tag entstehen zwei Videos für den nächsten Tag. Du lieferst zuerst zehn Ideen, ich wähle zwei, danach schreibst du die Skripte. Ich baue daraus Animation, Stimme und Schnitt.\n\nFAKTENTREUE (gilt für alles, was du lieferst)\n- Erfinde nichts. Jede Zahl, jedes Datum, jede Behauptung muss belegbar sein (amtliche Statistik, Gesetz, Studie, Behörden- oder Herstellerangabe). Nenne zu jeder Zahl Quelle und Jahr.\n- Kannst du eine Zahl nicht belegen, schreibe „nicht belegt“ und verwende sie nicht. Trägt eine Idee ohne belegbare Zahlen nicht, verwirf sie und sage es offen.\n- Alles, was eine Annahme ist (z. B. eine Modellperson), kennzeichne als Annahme und halte sie realistisch und nachvollziehbar.\n- Aussagen müssen legitim sein: keine Übertreibung, keine verzerrende Auswahl, keine Panikmache, keine falschen Gegensätze.\n- Diskussionsbedarf soll durch die Sache selbst entstehen (zum Beispiel, weil die Antwort der Intuition widerspricht oder von der persönlichen Lage abhängt). Sprich das nie aus: keine Aufforderung zum Streiten oder Meinungsäußern im Text, keine Provokation, kein Clickbait, keine künstlichen Cliffhanger.\n- Wenn dir Informationen fehlen, die das Ergebnis verändern, frage mich vorher gebündelt, statt zu raten.\n\nSPANNUNG UND QUALITÄT\n- Das Video muss ab der ersten Sekunde fangen und die Spannung bis zum Ergebnis kontinuierlich steigern. Kein Leerlauf, keine Füllsätze.\n- Schreibe so, dass sich daraus mehrere unterschiedliche Bildsequenzen, Wendungen und Situationswechsel ergeben (ich baue danach Design und Animation aus deinem Skript). Markiere in den Dramaturgie-Hinweisen, wo die Spannung steigt und welche Momente visuell besonders sein sollten (Zoom, Licht, Aufleuchten).\n- Nichts Übertriebenes: lieber ein klarer, sauberer Spannungsbogen als Effekthascherei.\n\nAUFBAU DES SKRIPTS (feste Reihenfolge, genau diese Phasen; Zeiten für ca. 70 Sekunden)\n1. hook (0 bis 5 s): Pflicht ist ein Duell im ersten Satz: beide Alternativen bzw. beide Personen konkret nennen und gegeneinanderstellen (z. B. „Einer verdient ab 16, der andere ab 24. Wer hat mit 40 mehr?“). Keine Einzelfrage („Wie viel kostet X wirklich?“), kein vorweggenommenes Ergebnis; ein Du-Szenario nur mit beiden Seiten im Hook. Höchstens 2 kurze Sätze, der erste mit nur 3 bis 4 Wörtern, die Stimme setzt sofort ein. Die Duell-Frage steht ab dem ersten Bild als Titel im Bild (Feld text); das erste Bild muss ohne Ton verständlich sein (beide Seiten, ihre Werte, ein Vergleichszeichen).\n2. regeln: die Spielregeln knapp als Mini-Fakten (kurz, mit konkreten Zahlen der Modellperson; im Bild als Chips), nicht lang aufzählen.\n3. falle (Denkfalle, bis ca. 16 s): „Klar, …. Oder?“ ruhig, kein „Los geht’s“.\n4. rennen: das Duell mit laufender Uhr bzw. Zählern; ruhiger Erzähler, kein Sportreporter; mindestens eine Zahl je 10 Sekunden.\n5. wendung1 (bei 18 bis 25 s), danach alle 8 bis 10 s eine weitere Wendung oder ein Führungswechsel (wendung2 …); insgesamt 4 bis 5 Wendepunkte, die Führung kippt mindestens einmal sichtbar.\n6. kipp (Höhepunkt, bei ca. 45 s): der Moment, in dem das Duell kippt; die Spannung ist am höchsten, das Ergebnis noch offen.\n7. ergebnis (erst bei ca. 80 % der Länge, bei 70 s also ca. 55 bis 58 s): exakte Euro-Zahl, dann\n8. warum: höchstens zwei Faktoren, kurz,\n9. pointe: eine überraschende Einordnung bzw. zweite Überraschung,\n10. schlusskarte (letzte 2 bis 3 s): ein kurzes Fazit oder die Pointe in einem Satz, der zugleich als Karte im Bild steht. Keine Frage, kein Aufruf.\nKein Schlusssatz mit Aufforderung und kein Folgen-Aufruf; die Kommentarfrage steht nur in der Caption. Nur wenn mein Auftrag es ausdrücklich verlangt: folgen bei ca. 20 s, höchstens 2 s, genau „Folg mir, damit du nichts verpasst.“\nLänge: 150 bis 190 gesprochene Wörter (ca. 65 bis 80 Sekunden bei flüssigem Tempo von 2,3 bis 2,7 Wörtern pro Sekunde). Es muss natürlich und flüssig klingen: lieber kürzen als hetzen. Sätze meist 3 bis 5 Wörter. Erzählhaltung neutral: Du-Ansprache höchstens im Hook, danach neutral formulieren („Wer wechselt, wird doppelt so lange überholt.“ statt „Du wirst …“). Zahlen im Sprechtext gerundet (im Bild exakt).\n\nREGIE-TEXT FÜR DIE STIMME (ElevenLabs „Ben“, Modell v4) — so schreiben, dass die Stimme Tonfall und Betonung perfekt umsetzt\n- Ruhig, sachlich, freundlich, sauber ausgesprochen; Erzähler wie in einer guten Wissenssendung.\n- Eine Zeile pro Satz; Leerzeile zwischen den Phasen.\n- Pausen steuern Satzzeichen: Punkt, Zeilenumbruch, Gedankenstrich „ – “. Zögern oder Spannung: Auslassungspunkte „…“. Keine <break>-Tags (v4 kennt sie nicht).\n- Betonung: höchstens EIN großgeschriebenes Wort pro Satz, nur auf dem Wort, das die Spannung trägt („Jetzt wird’s KNAPP.“).\n- Haltung: ruhige Tags wie [curious], [thoughtful], [calm], sparsam (höchstens ein Gefühls-Tag je Phase). Verboten: [excited], [shouting], [energetic] und alles Aufgeregte.\n- Höchstens 3 Ausrufezeichen im ganzen Skript. Kein „Los geht’s“. Kein Geschrei.\n- Fragen mit Fragezeichen; eine kurze Frage darf allein auf einer Zeile stehen („Oder?“).\n- Im Sprechtext Zahlen ausschreiben („tausendzweihundert Euro“), englische Wörter in Lautschrift („G T A sechs“). Im Untertitel-Text dürfen Ziffern stehen.\n- Countdowns als Satzfetzen mit Kommas: „Fünfzehn Kilometer, dreizehn, zwölf, zehn.“\n- Tempo nie künstlich erhöhen; es entsteht durch Satzlänge und Textmenge.\n\nCAPTION (nicht im Video, nur Beschreibung)\nGenau eine Zeile: Hook-Frage mit Suchbegriff? Emoji Ich hab’s simuliert. Kommentarfrage? 👇 #thema1 #thema2 #thema3 #wissen #simulation\nEtwa 150 Zeichen plus 5 Hashtags, kein #fyp oder #viral, keine Quellen, keine Hinweise wie „keine Anlageberatung“.\n\nLERNSTAND (aus unseren Zahlen, bitte berücksichtigen)\nStartwerte (Recherche 02.11.2026, 50 Videos von 6 Konten, öffentliche Zahlen) und eigene erste Zahlen:\n- Treffer (über 100.000 Aufrufe) sind meist Duell-Fragen zu großen Lebensentscheidungen mit großer Euro-Endzahl (Mieten oder Kaufen, Leasing, Studium oder Ausbildung), Länge 67 bis 72 Sekunden.\n- Kleine Einzeltipps (Reifendruck, Einkaufskasse, Händewaschen) und sozial- oder politiknahe Geldthemen (Kindergeld, Bürgergeld) erreichen kaum Aufrufe.\n- Caption, Hashtag-Zahl und Uhrzeit trennen Treffer nicht vom Rest; das Thema entscheidet. Wer dasselbe Thema später nachmacht, bekommt nur 0,2 bis 5 Prozent des Originals.\n- Erste eigene Zahlen (02.11.): durchschnittliche Wiedergabezeit ca. 26 Sekunden bei 66 Sekunden Länge (rund 39 Prozent). Der Lernstand wird täglich aus unseren Zahlen fortgeschrieben.\n\nGEWÄHLTE IDEEN (für diese schreibst du jetzt je ein makelloses Skript)\n{{IDEEN}}\n\nAUFGABE\nSchreibe für jede gewählte Idee ein makelloses, sendefertiges Skript nach allen Regeln oben. Erfinde nichts; jede Zahl mit Rechenweg und Quelle. Prüfe dein Skript am Ende selbst (Wortzahl bzw. Satzzahl, Fakten, Ton, Verbote) und trage das Ergebnis in selbstpruefung ein. Findest du beim Prüfen einen Fehler, korrigiere ihn vor der Ausgabe.\nGib je Idee das Skript lesbar aus: Titel, Segmente mit Text und Sprechtext (bzw. Sätze und Anzeige-Plan), Rechenweg, Annahmen, Quellen, Caption, Dramaturgie-Hinweise, Selbstprüfung. Feldstruktur zur Orientierung:\n{\"skripte\":[{\"nr\":1,\"titel\":\"\",\"thema\":\"\",\"laender\":\"\",\"segmente\":[{\"id\":\"hook\",\"phase\":\"hook\",\"text\":\"Untertitel-Text (Ziffern erlaubt)\",\"sprechtext\":\"Regie-Text, eine Zeile pro Satz\"}],\"woerter\":0,\"rechenweg\":\"Formel, Eingaben, Rechenschritte, Ergebnis\",\"zahlen\":{\"name\":\"wert\"},\"annahmen\":[\"(A) ...\"],\"quellen\":[\"(F) Quelle, Jahr\"],\"caption\":\"\",\"originalitaet\":\"Suche (deutsch) und Ergebnis\",\"dramaturgie\":[\"Hinweis mit Zeitpunkt\"],\"selbstpruefung\":[\"Wortzahl ..\",\"Fakten ..\",\"Ton ..\",\"Verbote ..\"]}]}"},"stelldirvor":{"name":"Stell dir vor","handle":"@stelldirvor.pov","praefix":"acc2","lernstand":"Startwerte (Recherche 02.11.2026 und eigene Eindrücke):\n- Ausführung entscheidet mehr als das Thema: dasselbe Thema erreicht bei einem aufwendig gebauten Kanal Millionen, bei einfach gebauten Kanälen nur Tausende.\n- Persönliche, greifbare Skalen (Papier falten, Graben) tragen eher als ein Weltuntergang ohne Vorstellbarkeit.\n- Erstes eigenes Video (Eiszeit, Großstadt-Skyline) gefiel dem Inhaber nicht: zu viel Stadt, zu wenig Veränderung im Bild, immer derselbe erhöhte Standpunkt. Künftig: Natur und wechselnde Standpunkte, sichtbare Bewegung und ein Zeitraffer, der etwas zeigt.\n- Der Lernstand wird täglich aus unseren Zahlen fortgeschrieben.","bisher":["Schall in Schritttempo (Test)","Eiszeit in Toronto (Was wäre, wenn wir wieder in eine Eiszeit steuern?)"],"zutaten":[{"name":"Ort","eintraege":["Ostseestrand","Almhütte","Kleingarten","Campingplatz am See","Deck eines Fischkutters","Galerie eines Leuchtturms","Weinberg","Hallig","Dorfbahnsteig","Waldlichtung","Dünen","Gletscherhütte","Hausboot","Reisterrassen","Lodge in der Savanne","Fjordufer","Vulkaninsel","Mangrovenufer","Hochmoor","Wattenmeer","Steg über einem Korallenriff","Wüstenoase","Bergsee","Schrebergarten am Bahndamm"]},{"name":"Natur","eintraege":["Zugvögel","Bienenvolk","Lachswanderung","Korallen","Golfstrom","Monsun","Mangroven","Ameisenstaat","Glühwürmchen","Wale","Meeresleuchten","Moor","Buchenwald","Pilzgeflecht","Seegras","Gezeiten","Polarlicht","Wanderdüne","Bambusblüte","Plankton"]},{"name":"Geschichte","eintraege":["Pyramidenbau","Limes","Hansekogge","Bau des Gotthardtunnels","Mondlandung 1969","erste deutsche Eisenbahn 1835","Kölner Dom (632 Jahre Bauzeit)","Buchdruck","Leuchtturm von Alexandria","Panamakanal","Abschlussdeich 1932","Atlantikkabel 1858","Chinesische Mauer","Stonehenge","Brooklyn Bridge","erster Heißluftballon 1783","Speicherstadt Hamburg","römisches Aquädukt"]},{"name":"Technik und Versorgung","eintraege":["Netzfrequenz 50 Hz","Trinkwasserdruck","Unterseekabel","GPS-Satelliten","Containerschiff","Fernwärme","Kläranlage","Schleuse","Stausee","Windpark","Kühlkette","Ampelschaltung","Funkmast","Bahnstrom","Pumpspeicherwerk","Deich","Pipeline","Wasserturm","Stromleitung","Leuchtfeuer"]},{"name":"Messgröße","eintraege":["Pegel in cm","Temperatur","Lautstärke in dB","Helligkeit in Lux","Anzahl","Salzgehalt","pH-Wert","Windstärke","Frequenz in Hz","Luftdruck","Höhe in m","Geschwindigkeit","Jahr","Gewicht in t","Entfernung"]},{"name":"Tageszeit","eintraege":["Morgengrauen","Mittag","Sonnenuntergang","Nacht","Polarnacht","Mitternachtssonne"]}],"zutaten_je_liste":2,"ideen_vorlage":"ROLLE\nDu bist mein Content-Stratege und Skript-Autor für den TikTok-Kanal „Stell dir vor“ (@stelldirvor.pov). Du denkst wie ein erfahrener Creator, der Kanäle ins TikTok Creator Rewards Program bringt: Gedankenexperimente, die jeder sofort verstehen will, mit einer messbaren Größe, die man beim Zuschauen wachsen sieht.\n\nUNSER KANAL\n- Format: „Was wäre, wenn …“ als 3D-POV-Zeitraffer ohne Stimme, 80 Sekunden. Der Zuschauer sieht das Ereignis aus der Ich-Perspektive. Es gibt nur drei Textebenen: eine Titelfrage am Anfang, links eine laufende Messwert-Anzeige (Zahl mit Etikett, z. B. Temperatur, Pegel, Jahr, die bis zu einem Höhepunkt mit „HIER“ läuft) und kurze kursive Sätze. Am Ende ein dunkler Abspann mit Titelfrage und Faktenzeile. Ton ist nur Atmo und Sounddesign.\n- Themen: spannende Gedankenexperimente mit messbarer Größe und einem Ereignis, das man von einem Standpunkt aus wachsen sieht (Wissenschaft, Natur, Geografie, Geschichte, Technik …). Die Orte dürfen überall liegen: Deutschland, weltweit, andere Länder. Wir brauchen Flexibilität und endlos viele spannende Themen; Sprache ist Deutsch. Auch Themen mit „in 5 Sekunden“-Rahmen sind erlaubt, wenn sie sich gut zeigen lassen.\n- WELT UND BEWEGUNG (wichtig): Die Welt passt zum Thema. Bevorzuge oft Natur (Meer, Küste, Strand, Wald, Wüste, Gebirge, Gletscher, See, Weltraumnähe); Städte nur, wenn sie wirklich passen. Variiere Ort, Tageszeit (Tag, Sonnenauf- und -untergang, Nacht) und Standpunkt (nicht immer „von oben aus dem Fenster“: Strandblick aufs Meer, Bootsdeck, Waldlichtung, Gipfel, Straße, Dünen, Eisfläche …). Es darf nie „gewartet“ werden: Im Zeitraffer muss alle paar Sekunden etwas Sichtbares passieren (Licht, Wetter, Wasser, Vegetation, Menschen, Tiere, Fahrzeuge), und die Messwert-Anzeige muss zur sichtbaren Veränderung passen.\n- Die Kamera darf sich langsam bewegen (weiche Fahrt, Schwenk, Zoom); sonst lange durchgehende Einstellungen. Erlaubt sind höchstens 1 bis 3 gezielte harte Schnitte, nur am Höhepunkt oder bei einem Maßstabs- bzw. Szenensprung.\n- Unser Alltag: Jeden Tag entstehen zwei Videos für den nächsten Tag. Du lieferst zuerst zehn Ideen, ich wähle zwei, danach schreibst du die Skripte. Ich baue daraus die 3D-Szene.\n\nREGELN FÜR IDEEN\n- Ein einziges Ereignis, das man von einem festen Standpunkt aus wachsen sieht, mit einer messbaren Größe für die Anzeige (z. B. Temperatur, Wasserstand, Entfernung, Höhe, Jahr, Anzahl).\n- Abwechslung: Verschiedene Welten, Standpunkte, Tageszeiten und Themenfelder; nie zwei gleiche Welttypen hintereinander. Natur ausdrücklich bedenken.\n- Ohne Opferdarstellung, ohne Gore, ohne reale Tragödien; Katastrophen enden sachlich.\n- THEMENFELDER (Feld \"feld\"): jedes der Felder 1 bis 3 mindestens einmal unter den 10 Ideen.\n  1. Natur und Tiere: Tierwanderungen, Pflanzen, Meeresströmungen, ein Ökosystem kippt oder wächst (ohne Gore).\n  2. Geschichte umgedreht: ein echter historischer Ort oder Moment, an dem eine Größe anders ist; keine reale Tragödie, keine Opfer.\n  3. Technik und Versorgung: Strom, Wasser, Kühlung, Kabel, Satelliten oder Lieferketten an einem konkreten Ort (nicht der weltweite Blackout).\n  4. Physik, Wetter, Geografie, Weltraum mit eigener Prämisse (nichts von der ANTI-LISTE).\n- MASSSTAB meist persönlich: Mindestens 6 der 10 Ideen spielen an einem greifbaren Ort (Strand, Garten, Straße, Boot, Hütte …) mit einer Skala, die man sich vorstellen kann; höchstens 4 sind global oder kosmisch, auch dann aus der Ich-Perspektive.\n- Kein Thema, zu dem es auf Deutsch schon ein Video mit der gleichen Prämisse gibt (Regel ORIGINALITÄT). Englische Vorbilder sind erlaubt, wenn sie nicht auf der ANTI-LISTE stehen, aber nur mit eigenem Skript und deutlich anderem Design (anderer Ort, andere Dramaturgie).\n- Keine Dopplung mit unseren bisherigen Videos.\n- Die Idee muss sich visuell tragen: Beschreibe, was sich in der Welt jede Phase sichtbar verändert.\n\nORIGINALITÄT (wichtigste Regel für Ideen; Vorrang vor dem Lernstand und vor allen Beispielen)\nAndere Creator fragen dieselbe KI mit ähnlichen Befehlen. Was dir als Erstes einfällt, haben sie auch bekommen, und genau das wollen wir nicht. Wir wollen Themen, die auf Deutsch noch niemand gemacht hat.\n1. Schreibe zuerst für dich die 20 naheliegendsten Ideen zu unserer Nische auf und streiche sie alle, dazu alles von der ANTI-LISTE unten (auch umbenannt oder mit anderen Zahlen). Nenne die gestrichenen Ideen in Stichworten (Feld \"gestrichen\").\n2. Baue mindestens 6 der 10 Ideen auf den ZUTATEN DES TAGES auf (Feld \"zutat\"), jede Zutat höchstens zweimal. Eine Zutat ist ein Ausgangspunkt, kein Zwang; passt eine gar nicht, lass sie weg.\n3. Prüfe jede Idee mit der Websuche: Gibt es auf Deutsch schon ein Video zur gleichen Frage (TikTok, YouTube, Instagram)? Suche mit 2 bis 3 deutschen Begriffen. Gefunden: Idee verwerfen und ersetzen. Englische Videos zur gleichen Frage sind erlaubt, wenn unsere Fassung eigenständig ist. Trage im Feld \"originalitaet\" ein: welche naheliegende Idee du damit vermeidest, die Suchbegriffe und das Ergebnis („kein deutsches Video gefunden“ oder „englisch: …“). Hast du keine Websuche, schreibe „ungeprüft“.\n4. Einzigartig UND relevant, beides ist Pflicht: ein ungewöhnlicher Winkel auf etwas, das viele kennen oder betrifft. Die Frage muss ohne Erklärung verständlich sein. Abseitige Nischen fallen genauso raus wie Standardthemen.\n5. Zwei Ideen, die sich nur im Zahlenwert oder im Ort unterscheiden, zählen als eine. Der Lernstand sagt, welche Art Thema trägt, nicht welches konkrete Thema du nehmen sollst.\n\nANTI-LISTE (die großen Was-wäre-wenn-Klassiker, gesperrt; nie vorschlagen, auch nicht umbenannt oder an anderem Ort)\nSonne explodiert, verschwindet oder ist kurz weg · Erde hört auf sich zu drehen, dreht schneller oder kreist nicht mehr · Mond stürzt ab, verschwindet, kommt näher oder ist aus Käse bzw. Schokolade · Asteroid oder Komet schlägt ein · Sauerstoff, Atmosphäre oder Schwerkraft ist für Sekunden weg · Riesen-Tsunami bzw. Megawelle trifft eine Stadt · Supervulkan, Yellowstone · stärkstes Erdbeben trifft deine Stadt · Schwarzes Loch kommt näher · Rogue-Planet trifft die Erde · alles Eis schmilzt, neue Eiszeit · Zombie-Ausbruch · Riesenmonster · Reise durch den Erdkern bzw. Loch durch die Erde · Fall in den Jupiter · ohne Raumanzug im All · Papier 42-mal falten · du schrumpfst oder wächst · Aufwachen im Jahr 3000 · alle Menschen springen, klatschen oder niesen gleichzeitig · Erde ist flach, ein Donut oder hat Saturnringe · Magnetfeld kippt, großer Sonnensturm · 1.000 Jahre Regen · weltweiter Stromausfall, Internet fällt weltweit aus · Schall oder Licht wird langsam\n\nFAKTENTREUE (gilt für alles, was du lieferst)\n- Erfinde nichts. Jede Zahl, jedes Datum, jede Behauptung muss belegbar sein (amtliche Statistik, Gesetz, Studie, Behörden- oder Herstellerangabe). Nenne zu jeder Zahl Quelle und Jahr.\n- Kannst du eine Zahl nicht belegen, schreibe „nicht belegt“ und verwende sie nicht. Trägt eine Idee ohne belegbare Zahlen nicht, verwirf sie und sage es offen.\n- Alles, was eine Annahme ist (z. B. eine Modellperson), kennzeichne als Annahme und halte sie realistisch und nachvollziehbar.\n- Aussagen müssen legitim sein: keine Übertreibung, keine verzerrende Auswahl, keine Panikmache, keine falschen Gegensätze.\n- Diskussionsbedarf soll durch die Sache selbst entstehen (zum Beispiel, weil die Antwort der Intuition widerspricht oder von der persönlichen Lage abhängt). Sprich das nie aus: keine Aufforderung zum Streiten oder Meinungsäußern im Text, keine Provokation, kein Clickbait, keine künstlichen Cliffhanger.\n- Wenn dir Informationen fehlen, die das Ergebnis verändern, frage mich vorher gebündelt, statt zu raten.\n\nLERNSTAND (aus unseren Zahlen, bitte berücksichtigen)\n{{LERNSTAND}}\n\nBISHERIGE VIDEOS (nicht wiederholen):\n- {{BISHER}}\n\nZUTATEN DES TAGES (zufällig gezogen, damit unsere Ideen sich von denen anderer unterscheiden)\n{{ZUTATEN}}\n\nAUFGABE\nWir brauchen zehn Videoideen in unserer Nische für den morgigen Tag, die auf Deutsch noch niemand gemacht hat. Sie sollen unterschiedlich sein (verschiedene Themenfelder, Länder bzw. Welten) und zum Lernstand passen. Prüfe jede Idee vor der Ausgabe gegen die Regeln, die ANTI-LISTE, die Websuche und die Faktenlage; schreibe nur Ideen auf, die du belegen kannst.\nAntworte AUSSCHLIESSLICH mit gültigem JSON (kein Markdown, kein Text davor oder danach) in genau dieser Form, mit genau 10 Einträgen unter \"ideen\":\n{\"gestrichen\":[\"naheliegende Idee in Stichworten\"],\"ideen\":[{\"nr\":1,\"titel\":\"Titelfrage „Was wäre, wenn …?“\",\"feld\":\"Natur und Tiere | Geschichte umgedreht | Technik und Versorgung | Physik, Wetter, Geografie, Weltraum\",\"massstab\":\"persönlich | global\",\"zutat\":\"welche Zutat des Tages (oder „keine“)\",\"originalitaet\":\"vermeidet: naheliegende Idee · Suche: Begriffe · Ergebnis: kein deutsches Video gefunden | englisch: … | ungeprüft\",\"ereignis\":\"was passiert, in einem Satz\",\"messgroesse\":\"was die Anzeige zeigt (Größe, Einheit, Start und Ende)\",\"welt\":\"Natur/Ort-Typ\",\"standpunkt\":\"wo steht der Zuschauer\",\"tageszeit_verlauf\":\"z. B. Morgen, Mittag, Abend\",\"bewegung\":\"was sich in der Welt sichtbar verändert, en Dramaturgie-Hinweisen, wo die Spannung steigt und welche Momente visuell besonders sein sollten (Zoom, Licht, Aufleuchten).\n- Nichts Übertriebenes: lieber ein klarer, sauberer Spannungsbogen als Effekthascherei.\n\nAUFBAU DES SKRIPTS (feste Reihenfolge, 80 Sekunden)\n- Titelfrage (steht 0,4 bis 4,4 s oben im Bild, 2 bis 3 Zeilen, deutsch, eine Frage mit offener Folge, die neugierig macht; sie verrät die Gefahr, die die Welt im Bild noch nicht kennt). Im Abspann kehrt sie zurück.\n- 12 bis 18 kursive Sätze: je 3 bis 9 Wörter, ruhig, Präsens, Aussagesätze, gern Du-Perspektive, Übergänge mit „Dann …“, keine Ausrufezeichen, keine Fragen. Erster Satz bei ca. 4,8 s, der letzte endet spätestens bei 70 s. Jeder Satz beschreibt genau das, was im selben Moment zu sehen ist; Zahlen im Satz stimmen mit der Anzeige überein.\n- Bogen: Start mit Countdown (0 bis ca. 8 s: der Countdown läuft ab Bild 1, die Welt lebt noch ahnungslos weiter, der Zuschauer weiß mehr) · Ereignis genau auf Countdown-Null (ca. 8 s; Bild, Licht und Ton kippen gleichzeitig) · Eskalation in mindestens 3 Stufen alle 8 bis 10 s (ca. 10 bis 50 s; Farbe und Licht wechseln mit der Lage) · Annäherung (50 bis 58 s; ein zweiter Countdown ist erlaubt) · Höhepunkt (58 bis 62 s; Anzeige zeigt „HIER“, im Moment selbst kein Satz) · Nachspiel (62 bis 70 s) · Abblende (70 bis 72 s) · Abspann (72 bis 80 s).\n- Messwert-Anzeige: läuft von Bild 1 an. Phase 1 ist ein Countdown bis zum Ereignis (bei Zeitraffer-Themen die Zeit bis zum Einsetzen der Veränderung), danach 2 bis 4 Etikettwechsel (je Stufe eine neue echte Messgröße), endet bei „HIER“. Darunter eine Statuszeile in Versalien (1 bis 3 Wörter zur Lage), deren Text mehrfach wechselt. Raffst du die Zeit, nenne den Zeitraffer-Faktor und eine nachvollziehbare Anzeige-Größe.\n- Faktenzeile für den Abspann: „ORT, JAHR · FAKT“ oder „FAKT · FAKT“, eine bis zwei Zeilen, belegbar; sie ordnet die Prämisse real ein.\n- Keine Stimme, keine Untertitel, kein Logo, keine Sticker, kein Folgen-Aufruf im Bild. Die Kommentarfrage steht nur in der Caption.\n\nCAPTION (nicht im Video, nur Beschreibung)\nGenau eine Zeile: Hook-Frage mit Suchbegriff? Emoji Ich hab’s durchgespielt. Kommentarfrage? 👇 #thema1 #thema2 #thema3 #wissen #waswaerewenn\nEtwa 150 Zeichen plus 5 Hashtags, kein #fyp oder #viral.\n\nLERNSTAND (aus unseren Zahlen, bitte berücksichtigen)\n{{LERNSTAND}}\n\nGEWÄHLTE IDEEN (für diese schreibst du jetzt je ein makelloses Skript)\n{{IDEEN}}\n\nAUFGABE\nSchreibe für jede gewählte Idee ein makelloses, sendefertiges Skript nach allen Regeln oben. Erfinde nichts; jede Zahl mit Rechenweg und Quelle. Prüfe dein Skript am Ende selbst (Wortzahl bzw. Satzzahl, Fakten, Ton, Verbote) und trage das Ergebnis in selbstpruefung ein. Findest du beim Prüfen einen Fehler, korrigiere ihn vor der Ausgabe.\nAntworte AUSSCHLIESSLICH mit gültigem JSON (kein Markdown, kein Text davor oder danach) in genau dieser Form, mit einem Eintrag je gewählter Idee:\n{\"skripte\":[{\"nr\":1,\"titel\":\"Titelfrage\",\"thema\":\"\",\"welt\":\"\",\"standpunkt\":\"\",\"tageszeit_verlauf\":\"\",\"zeitraffer\":\"\",\"kamera\":\"\",\"anzeige_plan\":[{\"von_s\":0,\"bis_s\":8,\"etikett\":\"ETIKETT (Phase 1: Countdown bis zum Ereignis)\",\"start\":\"\",\"ende\":\"\",\"einheit\":\"\",\"unter\":\"Statuszeile in Versalien\"}],\"saetze\":[{\"t_ca\":4.8,\"text\":\"Satz mit 3 bis 9 Wörtern.\"}],\"faktenzeile\":\"\",\"rechenweg\":\"Formel, Eingaben, Rechenschritte\",\"zahlen\":{\"name\":\"wert\"},\"annahmen\":[\"(A) ...\"],\"quellen\":[\"(F) Quelle, Jahr\"],\"caption\":\"\",\"originalitaet\":\"Suche (deutsch) und Ergebnis\",\"dramaturgie\":[\"Hinweis mit Zeitpunkt: was in der Welt passiert, Licht, Zoom\"],\"selbstpruefung\":[\"Satzzahl ..\",\"Fakten ..\",\"Anzeige passt zum Zeitraffer ..\",\"Verbote ..\"]}]}","ideen_text":"ROLLE\nDu bist mein Content-Stratege und Skript-Autor für den TikTok-Kanal „Stell dir vor“ (@stelldirvor.pov). Du denkst wie ein erfahrener Creator, der Kanäle ins TikT r nicht. Wir wollen Themen, die auf Deutsch noch niemand gemacht hat.\n1. Schreibe zuerst für dich die 20 naheliegendsten Ideen zu unserer Nische auf und streiche sie alle, dazu alles von der ANTI-LISTE unten (auch umbenannt oder mit anderen Zahlen). Nenne die gestrichenen Ideen in Stichworten (Feld \"gestrichen\").\n2. Baue mindestens 6 der 10 Ideen auf den ZUTATEN DES TAGES auf (Feld \"zutat\"), jede Zutat höchstens zweimal. Eine Zutat ist ein Ausgangspunkt, kein Zwang; passt eine gar nicht, lass sie weg.\n3. Prüfe jede Idee mit der Websuche: Gibt es auf Deutsch schon ein Video zur gleichen Frage (TikTok, YouTube, Instagram)? Suche mit 2 bis 3 deutschen Begriffen. Gefunden: Idee verwerfen und ersetzen. Englische Videos zur gleichen Frage sind erlaubt, wenn unsere Fassung eigenständig ist. Trage im Feld \"originalitaet\" ein: welche naheliegende Idee du damit vermeidest, die Suchbegriffe und das Ergebnis („kein deutsches Video gefunden“ oder „englisch: …“). Hast du keine Websuche, schreibe „ungeprüft“.\n4. Einzigartig UND relevant, beides ist Pflicht: ein ungewöhnlicher Winkel auf etwas, das viele kennen oder betrifft. Die Frage muss ohne Erklärung verständlich sein. Abseitige Nischen fallen genauso raus wie Standardthemen.\n5. Zwei Ideen, die sich nur im Zahlenwert oder im Ort unterscheiden, zählen als eine. Der Lernstand sagt, welche Art Thema trägt, nicht welches konkrete Thema du nehmen sollst.\n\nANTI-LISTE (die großen Was-wäre-wenn-Klassiker, gesperrt; nie vorschlagen, auch nicht umbenannt oder an anderem Ort)\nSonne explodiert, verschwindet oder ist kurz weg · Erde hört auf sich zu drehen, dreht schneller oder kreist nicht mehr · Mond stürzt ab, verschwindet, kommt näher oder ist aus Käse bzw. Schokolade · Asteroid oder Komet schlägt ein · Sauerstoff, Atmosphäre oder Schwerkraft ist für Sekunden weg · Riesen-Tsunami bzw. Megawelle trifft eine Stadt · Supervulkan, Yellowstone · stärkstes Erdbeben trifft deine Stadt · Schwarzes Loch kommt näher · Rogue-Planet r, kein Folgen-Aufruf im Bild. Die Kommentarfrage steht nur in der Caption.\n\nCAPTION (nicht im Video, nur Beschreibung)\nGenau eine Zeile: Hook-Frage mit Suchbegriff? Emoji Ich hab’s durchgespielt. Kommentarfrage? 👇 #thema1 #thema2 #thema3 #wissen #waswaerewenn\nEtwa 150 Zeichen plus 5 Hashtags, kein #fyp oder #viral.\n\nLERNSTAND (aus unseren Zahlen, bitte berücksichtigen)\nStartwerte (Recherche 02.11.2026 und eigene Eindrücke):\n- Ausführung entscheidet mehr als das Thema: dasselbe Thema erreicht bei einem aufwendig gebauten Kanal Millionen, bei einfach gebauten Kanälen nur Tausende.\n- Persönliche, greifbare Skalen (Papier falten, Graben) tragen eher als ein Weltuntergang ohne Vorstellbarkeit.\n- Erstes eigenes Video (Eiszeit, Großstadt-Skyline) gefiel dem Inhaber nicht: zu viel Stadt, zu wenig Veränderung im Bild, immer derselbe erhöhte Standpunkt. Künftig: Natur und wechselnde Standpunkte, sichtbare Bewegung und ein Zeitraffer, der etwas zeigt.\n- Der Lernstand wird täglich aus unseren Zahlen fortgeschrieben.\n\nGEWÄHLTE IDEEN (für diese schreibst du jetzt je ein makelloses Skript)\n{{IDEEN}}\n\nAUFGABE\nSchreibe für jede gewählte Idee ein makelloses, sendefertiges Skript nach allen Regeln oben. Erfinde nichts; jede Zahl mit Rechenweg und Quelle. Prüfe dein Skript am Ende selbst (Wortzahl bzw. Satzzahl, Fakten, Ton, Verbote) und trage das Ergebnis in selbstpruefung ein. Findest du beim Prüfen einen Fehler, korrigiere ihn vor der Ausgabe.\nGib je Idee das Skript lesbar aus: Titel, Segmente mit Text und Sprechtext (bzw. Sätze und Anzeige-Plan), Rechenweg, Annahmen, Quellen, Caption, Dramaturgie-Hinweise, Selbstprüfung. Feldstruktur zur Orientierung:\n{\"skripte\":[{\"nr\":1,\"titel\":\"Titelfrage\",\"thema\":\"\",\"welt\":\"\",\"standpunkt\":\"\",\"tageszeit_verlauf\":\"\",\"zeitraffer\":\"\",\"kamera\":\"\",\"anzeige_plan\":[{\"von_s\":0,\"bis_s\":8,\"etikett\":\"ETIKETT (Phase 1: Countdown bis zum Ereignis)\",\"start\":\"\",\"ende\":\"\",\"einheit\":\"\",\"un /* ---------- Speichern (eine Schreibaktion je Dokument nach der anderen) ---------- */
function kette(schluessel, fn) { const p = (S.kette[schluessel] || Promise.resolve()).then(fn, fn); S.kette[schluessel] = p.catch(() => {}); return p; }
function verlaufPlus(id, text) { const alt = Array.isArray(S.slots[id]?.verlauf) ? S.slots[id].verlauf : []; return [...alt, { zeit: jetzt(), text, von: "studio" }].slice(-30); }
async function slotSetzen(id, daten, ganz) {
  if (!S.db) throw { code: "kein_speicher" };
  return kette("s/" + id, async () => {
    const ref = S.db.doc("skripte/" + id), z = jetzt();
    if (ganz || !S.slots[id]) return ref.set({ ...daten, erstellt: S.slots[id]?.erstellt || z, aktualisiert: z });
    try { return await ref.update({ ...daten, aktualisiert: z }); }
    catch (e) { if (e?.code === "invalid_argument") return ref.set({ ...S.slots[id], ...daten, aktualisiert: z }); throw e; }
  });
}
const slotLoeschen = (id) => kette("s/" + id, () => S.db.doc("skripte/" + id).delete());

/* ---------- Tage ---------- */
function standardTag() {
  const hd = heute(), md = morgen();
  const frueh = [...new Set(Object.values(S.slots).map((d) => d.datum))].filter((d) => d && d >= hd && d < md && tagAktiv(d)).sort();
  if (frueh.length) return frueh[0];
  let d = md; for (let i = 0; i < 60 && tagFertig(d); i++) d = plusTage(d, 1);
  return d;
}
function offeneTage() {
  const hd = heute(), md = morgen();
  const alle = new Set([...Object.values(S.slots).map((d) => d.datum), ...Object.values(S.ideen).map((d) => d.datum), standardTag()]);
  return [...alle].filter((d) => d && d >= hd && !tagFertig(d) && (d >= md || tagAktiv(d))).sort();
}
function archivTage() {
  const hd = heute();
  return [...new Set(Object.values(S.slots).map((d) => d.datum))].filter((d) => d && (tagFertig(d) || d < hd)).sort().reverse().slice(0, 14);
}
function slotsEingang(neu) {
  const vorher = S.datum && tagFertig(S.datum);
  S.slots = neu; S.geladen = true;
  const std = standardTag();
  if (!S.erster) { S.erster = true; if (!S.manuell) S.datum = std; return; }
  if (!vorher && S.datum && tagFertig(S.datum) && S.datum !== std) {
    S.hinweis = wochentag(S.datum) + ": alle 4 Videos sind in Buffer geplant. Weiter mit " + wochentag(std) + ".";
    S.datum = std; S.manuell = false; return;
  }
  if (!S.manuell) S.datum = std;
}

/* ---------- Claude Code ---------- */
const sitzungsLink = (id) => "https://claude.ai/code/" + id;
function auftragText(auftrag) { return "AUFTRAG AUS DEM IDEEN-STUDIO\n" + JSON.stringify(auftrag) + "\nBefolge " + AUTO.anleitung + " (Abschnitt zu diesem Auftrag)."; }
function kurzAuftrag(a) {
  const name = { skripte: "Skripte recherchieren", neu_schreiben: "Skript neu schreiben", produzieren: "Produzieren und in Buffer planen", fortsetzen: "Weiterarbeiten" }[a.art] || a.art;
  const teile = [name, a.konto ? BEFEHLE[a.konto]?.name : "", kurzTag(a.datum)];
  if (a.slots) teile.push(a.slots.map(slotName).join(" und ")); if (a.slot) teile.push(slotName(a.slot)); if (a.ids) teile.push(a.ids.length + (a.ids.length === 1 ? " Video" : " Videos"));
  return teile.filter(Boolean).join(" · ");
}
async function auftragSenden(auftrag) {
  const nachricht = auftragText(auftrag); S.manuellerAuftrag = "";
  if (!S.db) return { ok: false, text: "Die Datenbank ist gerade nicht erreichbar." };
  if (!S.comments) { S.manuellerAuftrag = nachricht; return { ok: false, text: EMPFAENGER.off + " Oder kopiere den Auftrag (Tagesübersicht)." }; }
  const kann = await S.comments.canSendToClaude().catch(() => "off"); S.empfaenger = kann;
  if (kann !== "available") { S.manuellerAuftrag = nachricht; return { ok: false, text: (EMPFAENGER[kann] || EMPFAENGER.off) + " Den Auftrag kannst du in der Tagesübersicht kopieren." }; }
  const id = auftrag.datum + "-" + auftrag.art + "-" + Date.now().toString(36), kurz = kurzAuftrag(auftrag);
  try { await S.db.doc("auftraege/" + id).set({ id, zeit: jetzt(), datum: auftrag.datum, art: auftrag.art, auftrag, text: nachricht, kurz, status: "offen" }); }
  catch (e) { return { ok: false, text: "Der Auftrag konnte nicht gespeichert werden (" + (e?.code ?? "unbekannt") + ")." }; }
  try {
    const anchor = await S.comments.anchorFor($("#tag") || document.body);
    await S.comments.sendToClaude({ anchor, text: "Auftrag für Claude Code: " + kurz + "\n(ID " + id + "; Einzelheiten liegen in der Warteschlange des Studios.)" });
    S.db.doc("auftraege/" + id).update({ gemeldet: jetzt() }).catch(() => {});
    return { ok: true };
  } catch (e) {
    S.db.doc("auftraege/" + id).update({ status: "abgebrochen", fehler: String(e?.code || "unbekannt") }).catch(() => {});
    S.manuellerAuftrag = nachricht;
    return { ok: false, text: KOMM_FEHLER[e?.code] ?? "Senden an Claude hat nicht geklappt (" + (e?.code ?? "unbekannt") + "). Klicke noch einmal oder kopiere den Auftrag." };
  }
}
/* ---------- Aktionen ---------- */
/* Zutaten des Tages: je Liste n zufällige Einträge (gleiche Logik wie tools/chat_befehle.py und cockpit/lib/studio.mjs) */
function zutatenText(b) {
  const n = b.zutaten_je_liste || 2;
  return (b.zutaten || []).map((z) => { const rest = z.eintraege.slice(), wahl = []; while (wahl.length < n && rest.length) wahl.push(rest.splice(Math.floor(Math.random() * rest.length), 1)[0]); return "- " + z.name + ": " + wahl.join(" · "); }).join("\n");
}
function ideenBefehl(wunsch) {
  let t = K().ideen_vorlage.replace("{{LERNSTAND}}", () => lernText()).replace("- {{BISHER}}", () => bisherListe().map((x) => "- " + x).join("\n")).replace("{{ZUTATEN}}", () => zutatenText(K()));
  if (wunsch.trim()) t = t.replace("AUFGABE\n", () => "MEIN WUNSCH FÜR HEUTE: " + wunsch.trim() + "\n\nAUFGABE\n");
  return t + "\n\nVideo-Tag: " + S.datum + ". Alle Aussagen müssen für das Jahr " + S.datum.slice(0, 4) + " gelten.";

async function erzeugeIdeen() {
  const k = S.konto, id = "i-" + k, datum = S.datum;

  S.busy[id] = true; S.fehler[id] = null; S.fortschritt[id] = "Claude denkt nach …"; S.ctl[id] = new AbortController(); render();
  try {
    const data = await S.sample.json(ideenBefehl(S.wunsch[k]), { modelTier: "default", cache: false, signal: S.ctl[id].signal,
      onText: ({ text }) => { const n = (text.match(/"nr"\s*:/g) || []).length; S.fortschritt[id] = n ? "Idee " + Math.min(n, 10) + " von 10 …" : "Claude schreibt …"; renderSchritt1(); } });
    const liste = (data?.ideen || []).filter((x) => x && x.titel).slice(0, 10);
    if (!liste.length) throw { code: "invalid_json" };
    const dok = { konto: k, datum, ideen: liste, wunsch: S.wunsch[k] || "", erzeugt: jetzt() };
    S.ideen[iid(k, datum)] = dok;
    if (S.db) await kette("i/" + iid(k, datum), () => S.db.doc("ideen/" + iid(k, datum)).set(dok)).catch((e) => { S.fehler[id] = "Die Ideen sind da, konnten aber nicht gespeichert werden (" + (e?.code ?? "unbekannt") + ")."; });

}
async function waehle(k, slot, i) {

      if (!AENDERBAR.has(d.status)) { S.fehler[fid] = "Für diese Idee läuft schon die Arbeit (" + (STATUS[d.status]?.[0] ?? d.status) + "). Verwirf zuerst das Skript unten."; render(); return; }

      status: "gewaehlt", fortschritt: "", fehler: "", verlauf: [{ zeit: jetzt(), text: "Idee gewählt", von: "studio" }] }, true);

/* Erst senden (Warteschlange + Kommentar an Claude, solange die Klick-Geste frisch ist), dann den Status der Videos setzen.
   Der vierte Parameter (früher: Rücksetzen nach Fehler) wird nicht mehr gebraucht, weil bei Fehlern nichts geändert wurde. */
async function mitAuftrag(busyId, aenderungen, auftrag, _unbenutzt) {
  if (S.busy[busyId]) return;
  S.busy[busyId] = true; S.fehler[busyId] = null; render();
  try {
    const r = await auftragSenden(auftrag);
    if (!r.ok) S.fehler[busyId] = r.text;
    else for (const [id, daten] of aenderungen) await slotSetzen(id, daten);
  } catch (e) { S.fehler[busyId] = "Speichern nicht möglich (" + (e?.code ?? "unbekannt") + ")."; }
  S.busy[busyId] = false; render();
}
function skripteAnfordern(k) {
  const offen = SLOTS.filter((s) => brauchtSkript(slotDoc(k, s)));
  if (!offen.length) return;
  mitAuftrag("cc-" + k, offen.map((s) => [sid(k, s), { status: "recherche", fehler: "", fehler_phase: "", fortschritt: "An Claude Code übergeben, Recherche startet …", angefordert: jetzt(), verlauf: verlaufPlus(sid(k, s), "Recherche angefordert") }]),
    { art: "skripte", datum: S.datum, konto: k, slots: offen }, offen.map((s) => [sid(k, s), { status: "gewaehlt", fortschritt: "" }]));
}

  S.fehler["k-" + id] = null;
  mitAuftrag("n-" + id, [[id, { status: "recherche", kommentar, kommentar_zeit: jetzt(), fehler: "", fortschritt: "Neufassung angefordert", verlauf: verlaufPlus(id, "Neufassung angefordert: " + kommentar.slice(0, 120)) }]],
    { art: "neu_schreiben", datum: S.datum, konto: k, slot, kommentar }, [[id, { status: alt }]]).then(() => { if (!S.fehler["n-" + id]) S.entwurf[id] = ""; render(); });
}

}
const freigeben = (k, s) => einfach(sid(k, s), { status: "freigegeben", freigegeben_am: jetzt() }, "Freigegeben");
const zuruecknehmen = (k, s) => einfach(sid(k, s), { status: "skript_fertig" }, "Freigabe zurückgenommen");

    offen ? h("button", { class: "btn", id: "skriptbtn", disabled: !!S.busy["cc-" + k], onclick: () => skripteAnfordern(k) },
      S.busy["cc-" + k] ? "Wird übergeben …" : offen === 2 ? "Beide Skripte recherchieren lassen" : "Skript recherchieren lassen") : null));
}

/* ---------- Start ---------- */
async function start() {
  S.datum = morgen(); S.tab = "tab-" + Math.random().toString(36).slice(2, 10);
  try { Object.assign(S.wunsch, JSON.parse(localStorage.getItem("studio-wunsch") || "{}")); } catch (e) {}
  $("#datum").addEventListener("change", (e) => { if (e.target.value) { S.datum = e.target.value; S.manuell = S.datum !== standardTag(); S.hinweis = ""; render(); } });
  document.addEventListener("focusout", () => setTimeout(() => {
    const a = document.activeElement; if (a && a.tagName === "TEXTAREA") return;
    const f = [...S.spaeter]; S.spaeter.clear(); f.forEach((fn) => fn());
  }, 250));
  render();
  const nutze = (n) => { try { return Promise.resolve(window.claude?.use ? window.claude.use(n) : null).catch(() => null); } catch (e) { return Promise.resolve(null); } };
  const [db, sample, user, comments] = await Promise.all([nutze("db"), nutze("sample"), nutze("user"), nutze("comments")]);
  S.db = db; S.sample = sample; S.user = user; S.comments = comments;
  S.empfaenger = comments ? await Promise.resolve(comments.canSendToClaude()).catch(() => "off") : "off";
  render();
  if (!db) return;
  const timer = setTimeout(() => { S.dbZeit = true; render(); }, 10000);
  const da = () => { clearTimeout(timer); S.dbZeit = false; };
  for (const k of KONTEN) {
    db.doc("stand/lernstand-" + BEFEHLE[k].praefix).onSnapshot((snap) => { const d = snap.data(); if (d?.text) { S.lernstand[k] = d.text; renderLern(); } }, () => {});
  }
  db.collection("skripte").where("datum", ">=", plusTage(heute(), -14)).onSnapshot((snap) => {
    da(); const neu = {}; snap.docs.forEach((d) => { if (d.exists) neu[d.id] = d.data(); }); slotsEingang(neu); render();
  }, (e) => { da(); S.fehler.fort = "Gespeicherter Stand nicht lesbar (" + (e?.code ?? "unbekannt") + "). Lade die Seite neu."; render(); });
  db.collection("ideen").where("datum", ">=", plusTage(heute(), -3)).onSnapshot((snap) => {
    const neu = {}; snap.docs.forEach((d) => { if (d.exists) neu[d.id] = d.data(); }); S.ideen = neu; render();
  }, () => {});
  db.collection("laeufe").where("datum", ">=", plusTage(heute(), -14)).onSnapshot((snap) => {
    const neu = {}; snap.docs.forEach((d) => { if (d.exists) neu[d.id] = d.data(); }); S.laeufe = neu; renderTag();
  }, () => {});
  db.collection("auftraege").where("datum", ">=", plusTage(heute(), -3)).onSnapshot((snap) => {
    const neu = {}; snap.docs.forEach((d) => { if (d.exists) neu[d.id] = d.data(); }); S.auftraege = neu; renderTag();
  }, () => {});
}
start();
</script>
