<style>
/* Layout: oben der Video-Tag (offene Tage als Chips) und die Tagesübersicht mit allen 4 Videos und der Claude-Code-Sitzung,
   darunter die Konto-Wahl (grün = Simulierbar, violett = stelldirvor.pov, wie im Obsidian-Farbcode) und der Ablauf je Konto;
   unten fest die Auswahlleiste. Alles liegt in der Datenbank des Artifacts und bleibt beim erneuten Öffnen erhalten. */
:root {
  --bg: #F4F6F4; --surface: #FFFFFF; --surface2: #ECF0EE; --fg: #14191C; --muted: #566169; --line: #D8DFDC;
  --a1: #1B8F52; --a1-soft: #DDF3E8; --a2: #7440CF; --a2-soft: #EAE0FA;
  --warn: #9A6200; --warn-soft: #FBEFD2; --bad: #B5382A; --bad-soft: #F8DDD8; --ok: #1B8F52; --ok-soft: #DDF3E8; --run: #1F5FBF; --run-soft: #DDE8FA; --on: #FFFFFF;
  --accent: var(--a1); --accent-soft: var(--a1-soft);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1214; --surface: #161C1F; --surface2: #1E2629; --fg: #E7ECEA; --muted: #98A5A1; --line: #2B3539;
    --a1: #3FD58D; --a1-soft: #153A2A; --a2: #B88DFF; --a2-soft: #2B1F47;
    --warn: #E8B24A; --warn-soft: #3A2D12; --bad: #FF8A7A; --bad-soft: #3D1D19; --ok: #3FD58D; --ok-soft: #153A2A; --run: #8DB8FF; --run-soft: #172740; --on: #0B1210; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1214; --surface: #161C1F; --surface2: #1E2629; --fg: #E7ECEA; --muted: #98A5A1; --line: #2B3539;
  --a1: #3FD58D; --a1-soft: #153A2A; --a2: #B88DFF; --a2-soft: #2B1F47;
  --warn: #E8B24A; --warn-soft: #3A2D12; --bad: #FF8A7A; --bad-soft: #3D1D19; --ok: #3FD58D; --ok-soft: #153A2A; --run: #8DB8FF; --run-soft: #172740; --on: #0B1210; color-scheme: dark;
}
body[data-konto="stelldirvor"] { --accent: var(--a2); --accent-soft: var(--a2-soft); }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; margin: 0;
  padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; }
h2 { font-size: 20px; } h3 { font-size: 17px; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 13px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: end; }
.top .sub { color: var(--muted); }
.days { display: flex; flex-wrap: wrap; gap: 8px; }
.day { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.day[aria-pressed="true"] { border: 2px solid var(--fg); font-weight: 600; padding: 5px 13px; }
.tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tab { text-align: left; border: 2px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.tab b { font-family: var(--f-display); font-size: 18px; }
.tab small { color: var(--muted); }
.tab[aria-pressed="true"] { border-color: var(--tabc); background: var(--tabbg); }
.tab[data-k="simulierbar"] { --tabc: var(--a1); --tabbg: var(--a1-soft); }
.tab[data-k="stelldirvor"] { --tabc: var(--a2); --tabbg: var(--a2-soft); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.steps li { border-top: 4px solid var(--line); padding-top: 6px; font-size: 14px; color: var(--muted); }
.steps li.done { border-color: var(--accent); color: var(--fg); }
.steps li.now { border-color: var(--accent); color: var(--fg); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 8px; padding: 11px 16px; font-weight: 600; background: var(--accent); color: var(--on); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.small { padding: 6px 10px; font-size: 14px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
textarea { width: 100%; min-height: 84px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
label.lbl { font-weight: 600; font-size: 14px; }
details > summary { cursor: pointer; font-weight: 600; }
details .body { margin-top: 10px; display: grid; gap: 10px; }
pre.text { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: var(--f-body); }
.note { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 15px; }
.err { border-left: 4px solid var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: 0 8px 8px 0; }
.good { border-left: 4px solid var(--ok); background: var(--ok-soft); padding: 10px 12px; border-radius: 0 8px 8px 0; }
.ideas { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card.sel { border: 2px solid var(--accent); }
.card .head { display: flex; gap: 12px; align-items: baseline; }
.card .nr { font-family: var(--f-mono); color: var(--accent); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 2px 10px; font-size: 14px; }
.facts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 16px; margin: 0; }
@media (min-width: 720px) { .facts { grid-template-columns: 170px minmax(0, 1fr); } }
.facts dt { color: var(--muted); font-size: 14px; }
.facts dd { margin: 0 0 6px; min-width: 0; overflow-wrap: anywhere; }
.slot { display: flex; flex-wrap: wrap; gap: 8px; }
.slotbtn { border: 1px solid var(--line); background: var(--surface2); color: var(--fg); border-radius: 8px; padding: 7px 12px; }
.slotbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 600; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
.bar .in { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.bar .pick { display: grid; gap: 2px; min-width: 0; font-size: 14px; }
.bar .pick span { overflow-wrap: anywhere; }
.scripts { display: grid; gap: 14px; }
.seg { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
@media (min-width: 720px) { .seg { grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; } }
.seg .ph { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.badge { font-family: var(--f-mono); font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--surface2); }
.badge.ok { background: var(--accent-soft); } .badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.bad { background: var(--bad-soft); color: var(--bad); }
.pill { font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--surface2); color: var(--fg); white-space: nowrap; }
.pill.run { background: var(--run-soft); color: var(--run); } .pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.over { display: grid; gap: 0; }
.orow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
@media (min-width: 720px) { .orow { grid-template-columns: 190px minmax(0, 1fr) auto; align-items: baseline; } }
.orow .wer { font-weight: 600; font-size: 15px; }
.orow .wer.a1 { color: var(--a1); } .orow .wer.a2 { color: var(--a2); }
.orow .was { min-width: 0; overflow-wrap: anywhere; }
.orow .was small { display: block; color: var(--muted); font-size: 14px; }
.verlauf { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
.state { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .slotbtn, .day { transition: background-color .15s, border-color .15s; } }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>Ideen-Studio</h1>
      <p class="sub" id="zielzeile">Videos für morgen</p>
    </div>
    <div class="row">
      <label class="lbl" for="datum">Anderer Tag</label>

<script type="application/json" id="befehle">__BEFEHLE_JSON__</script>
<script>
const BEFEHLE = JSON.parse(document.getElementById("befehle").textContent);
const KONTEN = ["simulierbar", "stelldirvor"];
const SLOTS = ["mittag", "abend"];
/* Anbindung an Claude Code: Auftrag in die Warteschlange (auftraege/) und Kommentar an Claude; der Disponent (eigene Sitzung,
   docs/automatik/disponent.md) startet je Video-Tag eine Sitzung bzw. schickt ihr den Auftrag. Kein Connector nötig. */
const AUTO = { anleitung: "docs/automatik/tages-sitzung.md" };
const FELDER_IDEE = {
  simulierbar: [["hook", "Erster Satz"], ["ergebnis_ansatz", "Rechnung und Ergebnis"], ["warum_relevant", "Wen es betrifft"], ["diskussion", "Gesprächsstoff (nur intern)"], ["daten", "Belegbare Daten"], ["bildidee", "Bildidee"], ["laender", "Land"], ["risiko", "Risiko"]],
  stelldirvor: [["ereignis", "Ereignis"], ["messgroesse", "Messwert-Anzeige"], ["welt", "Welt"], ["standpunkt", "Standpunkt"], ["tageszeit_verlauf", "Tageszeit"], ["bewegung", "Bewegung in der Welt"], ["kamera", "Kamera"], ["zeitraffer", "Zeitraffer"], ["hoehepunkt", "Höhepunkt"], ["pointe", "Pointe"], ["diskussion", "Gesprächsstoff (nur intern)"], ["daten", "Belegbare Daten"], ["laender", "Ort"], ["risiko", "Risiko"]],
};
const STATUS = {
  gewaehlt: ["Idee gewählt", ""], recherche: ["Claude Code recherchiert", "run"], skript_fertig: ["Skript fertig, bitte prüfen", "warn"],
  freigegeben: ["Freigegeben", "ok"], uebergeben: ["Übergeben, startet", "run"], produktion: ["In Produktion", "run"],
  rueckfrage: ["Rückfrage an dich", "bad"], geplant: ["In Buffer geplant", "ok"], gepostet: ["Gepostet", "ok"], fehler: ["Fehler", "bad"],
};
const FERTIG = new Set(["geplant", "gepostet"]);
const AENDERBAR = new Set(["gewaehlt", "fehler"]);
const EMPFAENGER = { available: "", writers_only: "Nur Bearbeiter des Studios können Aufträge an Claude senden.",
  no_session: "Gerade empfängt keine Claude-Sitzung Aufträge (der Disponent läuft nicht).", off: "In dieser Ansicht lassen sich keine Kommentare an Claude senden. Öffne das Studio im Browser auf claude.ai." };
const S = { konto: "simulierbar", datum: "", manuell: false, db: null, sample: null, user: null, comments: null, empfaenger: "", tab: "",
  lernstand: {}, ideen: {}, slots: {}, laeufe: {}, auftraege: {}, geladen: false, erster: false, dbZeit: false,
  wunsch: { simulierbar: "", stelldirvor: "" }, entwurf: {}, busy: {}, fehler: {}, fortschritt: {}, ctl: {}, sitzung: {}, hinweis: "", kette: {}, spaeter: new Set(), manuellerAuftrag: "" };

/* ---------- Hilfen ---------- */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
}
const K = () => BEFEHLE[S.konto];
const pf = (k = S.konto) => BEFEHLE[k].praefix;
function iso(d) { return new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Berlin" }).format(d); }
const heute = () => iso(new Date());
const morgen = () => iso(new Date(Date.now() + 864e5));
function plusTage(isoDatum, n) { const t = new Date(isoDatum + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function wochentag(isoDatum) { return new Date(isoDatum + "T12:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
function kurzTag(isoDatum) { return new Date(isoDatum + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }); }
function uhr(isoDatum) { const we = [0, 6].includes(new Date(isoDatum + "T12:00:00").getDay()); return { mittag: we ? "09:30" : "12:30", abend: "19:30" }; }
const slotName = (s) => (s === "mittag" ? "Mittag" : "Abend");
const sid = (k, s, d = S.datum) => pf(k) + "-" + d + "-" + s;
const iid = (k, d = S.datum) => pf(k) + "-" + d;
const slotDoc = (k, s, d = S.datum) => S.slots[sid(k, s, d)];
const ideenListe = (k = S.konto) => S.ideen[iid(k)]?.ideen || [];
const alleSlots = (d = S.datum) => KONTEN.flatMap((k) => SLOTS.map((s) => ({ k, s, id: sid(k, s, d), doc: S.slots[sid(k, s, d)] })));
const tagFertig = (d) => alleSlots(d).every((x) => x.doc && FERTIG.has(x.doc.status));
const tagAktiv = (d) => alleSlots(d).some((x) => x.doc && x.doc.status !== "gewaehlt" && !FERTIG.has(x.doc.status));
const ideeTitel = (d) => (d ? d.idee?.titel || d.titel || "" : "");   /* ältere Dokumente (vor dem Speicher-Umbau) haben kein Feld idee */
const brauchtSkript = (d) => d && (d.status === "gewaehlt" || (d.status === "fehler" && d.fehler_phase !== "produktion"));
const jetzt = () => new Date().toISOString();
function zeitText(isoZeit) { try { return new Date(isoZeit).toLocaleString("de-DE", { timeZone: "Europe/Berlin", weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return String(isoZeit || ""); } }
function lernText() { return S.lernstand[S.konto] ?? K().lernstand; }
function bisherListe() {
  const titel = new Set(K().bisher);
  for (const d of Object.values(S.slots)) if (d.konto === S.konto && d.titel) titel.add(d.titel);
  return [...titel];
}
function mitLinks(text) {
  return String(text).split(/(https?:\/\/[^\s)]+)/).map((t, i) => (i % 2 ? h("a", { href: t, target: "_blank", rel: "noopener" }, t) : t));
}
function copy(text, knopf) {
  const fertig = () => { const t = knopf.textContent; knopf.textContent = "Kopiert"; setTimeout(() => (knopf.textContent = t), 1500); };
  (navigator.clipboard?.writeText(text) ?? Promise.reject()).then(fertig).catch(() => {
    const ta = h("textarea", { "aria-label": "Zum Kopieren" }); ta.value = text; knopf.after(ta); ta.select();
  });
}
function speichereWunsch() { try { localStorage.setItem("studio-wunsch", JSON.stringify(S.wunsch)); } catch (e) {} }
const FEHLER = {
  not_granted: "Du hast Claude für diese Seite nicht freigegeben. Öffne das Berechtigungs-Menü des Artifacts und erlaube es, dann klicke noch einmal.",
  rate_limited: "Zu viele Anfragen oder dein Nutzungslimit ist erreicht. Warte etwas und klicke dann erneut.",
  invalid_json: "Die Antwort war kein lesbares JSON. Klicke noch einmal; hilft das nicht, nimm den Weg über Claude Chat unten.",
  upstream_error: "Verbindung zu Claude unterbrochen. Klicke noch einmal.",
  session_expired: "Du musst dich neu bei claude.ai anmelden.",
  refused: "Claude hat diese Anfrage abgelehnt. Ändere den Wunsch und versuche es erneut.",
  sampling_disabled: "Claude ist für dieses Konto hier nicht verfügbar. Nimm den Weg über Claude Chat unten.",
  prompt_too_large: "Die Anfrage war zu groß.", empty_completion: "Claude hat nichts geschrieben. Klicke noch einmal.",
};
const fehlerText = (e) => FEHLER[e?.code] ?? "Es hat nicht geklappt (" + (e?.code ?? "unbekannt") + "). Klicke noch einmal.";
const KOMM_FEHLER = {
  consent_required: "Du hast dem Studio noch nicht erlaubt, Kommentare in deinem Namen an Claude zu senden. Klicke noch einmal und bestätige die Abfrage.",
  forbidden: "Kommentare aus dem Studio sind für dich ausgeschaltet (einschalten im Kommentar-Bereich von claude.ai). Bis dahin: Auftrag kopieren.",
  claude_unavailable: "Gerade empfängt keine Claude-Sitzung Aufträge (der Disponent läuft nicht). Kopiere den Auftrag oder gib mir in der Hauptsitzung Bescheid.",
  rate_limited: "Zu schnell hintereinander. Warte eine Minute und klicke noch einmal.",
  unavailable: "Kommentare sind gerade nicht verfügbar. Klicke gleich noch einmal.",
  not_granted: "Diese Ansicht kann keine Kommentare an Claude senden. Öffne das Studio im Browser auf claude.ai.",
  capability_disabled: "Diese Ansicht kann keine Kommentare an Claude senden. Öffne das Studio im Browser auf claude.ai.",
  capability_removed: "Diese Ansicht kann keine Kommentare an Claude senden. Öffne das Studio im Browser auf claude.ai.",
};

/* ---------- Speichern (eine Schreibaktion je Dokument nach der anderen) ---------- */
function kette(schluessel, fn) { const p = (S.kette[schluessel] || Promise.resolve()).then(fn, fn); S.kette[schluessel] = p.catch(() => {}); return p; }
function verlaufPlus(id, text) { const alt = Array.isArray(S.slots[id]?.verlauf) ? S.slots[id].verlauf : []; return [...alt, { zeit: jetzt(), text, von: "studio" }].slice(-30); }
async function slotSetzen(id, daten, ganz) {
  if (!S.db) throw { code: "kein_speicher" };
  return kette("s/" + id, async () => {
    const ref = S.db.doc("skripte/" + id), z = jetzt();
    if (ganz || !S.slots[id]) return ref.set({ ...daten, erstellt: S.slots[id]?.erstellt || z, aktualisiert: z });
    try { return await ref.update({ ...daten, aktualisiert: z }); }
    catch (e) { if (e?.code === "invalid_argument") return ref.set({ ...S.slots[id], ...daten, aktualisiert: z }); throw e; }
  });
}
const slotLoeschen = (id) => kette("s/" + id, () => S.db.doc("skripte/" + id).delete());

/* ---------- Tage ---------- */
function standardTag() {
  const hd = heute(), md = morgen();
  const frueh = [...new Set(Object.values(S.slots).map((d) => d.datum))].filter((d) => d && d >= hd && d < md && tagAktiv(d)).sort();
  if (frueh.length) return frueh[0];
  let d = md; for (let i = 0; i < 60 && tagFertig(d); i++) d = plusTage(d, 1);
  return d;
}
function offeneTage() {
